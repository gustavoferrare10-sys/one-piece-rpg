<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navegação Pirata</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(#0a4fa3,#063b7a);
  color:#fff;
}
header{
  text-align:center;
  padding:18px;
  background:#042e63;
  font-size:22px;
  font-weight:bold;
}
main{
  max-width:950px;
  margin:auto;
  padding:15px;
}
button{
  width:100%;
  padding:14px;
  margin:8px 0;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#f5c542;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:transform 0.2s;
}
button:hover:not(:disabled){
  transform:scale(1.02);
}
button:disabled{
  background:#888;
  cursor:not-allowed;
}
.card{
  background:rgba(0,0,0,0.35);
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}
.hidden{display:none}

/* RARIDADES */
.comum{background:#95a5a6}
.raro{background:#2ecc71}
.epico{background:#9b59b6}
.lendario{background:#f1c40f;color:#000}
.mitico{background:#e74c3c}

.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
  margin-bottom:6px;
}

/* PROGRESSO ANIMADO */
.progress-container{
  background:#003366;
  border-radius:12px;
  height:35px;
  position:relative;
  overflow:hidden;
  margin:15px 0;
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.4);
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff0000,#ff9900,#ffcc00);
  background-size:200% 100%;
  transition:width 0.8s ease-out;
  animation:shimmer 2s linear infinite;
  position:relative;
}

@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.luffy{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  left:0%;
  font-size:28px;
  transition:left 0.8s ease-out;
  animation:bounce 0.5s ease-in-out infinite;
  filter:drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
  z-index:10;
}

@keyframes bounce{
  0%, 100%{transform:translateY(-50%) translateX(0)}
  50%{transform:translateY(-55%) translateX(2px)}
}

/* PARTÍCULAS DE POEIRA */
.dust{
  position:absolute;
  width:8px;
  height:8px;
  background:rgba(255,255,255,0.6);
  border-radius:50%;
  animation:dustFloat 1s ease-out forwards;
  pointer-events:none;
}

@keyframes dustFloat{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(-30px,10px) scale(0);
    opacity:0;
  }
}

/* ANIMAÇÃO DE RECOMPENSA */
@keyframes rewardPop{
  0%{transform:scale(0) rotate(-180deg);opacity:0}
  50%{transform:scale(1.1) rotate(10deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}

.reward-animate{
  animation:rewardPop 0.6s ease-out;
}

/* EFEITO DE BRILHO NA BARRA */
.progress-bar::after{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation:shine 3s ease-in-out infinite;
}

@keyframes shine{
  0%{left:-100%}
  50%, 100%{left:200%}
}

/* PROGRESSO TEXT */
.progress-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:14px;
  font-weight:bold;
  color:#fff;
  text-shadow:1px 1px 3px rgba(0,0,0,0.8);
  z-index:5;
}
</style>
</head>

<body>

<header>🏴‍☠️ Navegação Pirata — One Piece</header>

<main>
<button id="btnGrand">🌊 Grand Line</button>
<button id="btnNovo">🔥 Novo Mundo</button>

<div class="progress-container" id="progressContainer">
  <div class="progress-bar" id="barra"></div>
  <div class="progress-text" id="progressText">0 / 5 Eventos</div>
  <div class="luffy" id="luffy">🏃‍♂️</div>
</div>

<div id="evento" class="card hidden"></div>
<button id="btnConcluir" class="hidden">⚔️ Concluir Evento</button>
<div id="recompensa" class="card hidden"></div>
</main>

var recompensas = {

/* ================= SALVAMENTO ================= */
function salvarEstado(){
  localStorage.setItem("eventosConcluidos", String(eventosConcluidos));
  localStorage.setItem("cooldownFim", String(cooldownFim));
}

function carregarEstado(){
  var e = localStorage.getItem("eventosConcluidos");
  var c = localStorage.getItem("cooldownFim");
  eventosConcluidos = e ? parseInt(e,10) : 0;
  cooldownFim = c ? parseInt(c,10) : 0;
}

/* ================= ANIMAÇÕES ================= */
function criarPoeira(){
  var container = document.getElementById("progressContainer");
  var luffy = document.getElementById("luffy");
  var rect = luffy.getBoundingClientRect();
  var containerRect = container.getBoundingClientRect();
  
  var dust = document.createElement("div");
  dust.className = "dust";
  dust.style.left = (rect.left - containerRect.left) + "px";
  dust.style.top = (rect.top - containerRect.top + 15) + "px";
  
  container.appendChild(dust);
  
  setTimeout(function(){
    container.removeChild(dust);
  }, 1000);
}

var dustInterval = null;

function iniciarAnimacaoPoeira(){
  pararAnimacaoPoeira();
  dustInterval = setInterval(criarPoeira, 200);
}

function pararAnimacaoPoeira(){
  if(dustInterval){
    clearInterval(dustInterval);
    dustInterval = null;
  }
}

/* ================= UI ================= */
function atualizarBarra(){
  var progresso = eventosConcluidos % 5;
  var p = progresso * 20;
  
  document.getElementById("barra").style.width = p + "%";
  document.getElementById("luffy").style.left = (p === 0 ? 0 : p - 3) + "%";
  document.getElementById("progressText").textContent = progresso + " / 5 Eventos";
  
  if(p > 0){
    iniciarAnimacaoPoeira();
    setTimeout(pararAnimacaoPoeira, 1000);
  }
}

function podeAgir(){
  return Date.now() >= cooldownFim;
}

/* ================= LÓGICA ================= */
function gerarEvento(modo){
  if(!podeAgir()){
    alert("Aguarde 10 minutos para o próximo evento.");
    return;
  }
  modoAtual = modo;
  cooldownFim = Date.now() + COOLDOWN;
  salvarEstado();

  var e = eventos[modo][Math.floor(Math.random()*eventos[modo].length)];
  document.getElementById("evento").innerHTML =
    "<h3>📜 Evento</h3>"+
    "<p><b>Descrição:</b> "+e.desc+"</p>"+
    "<p><b>Inimigo:</b> "+e.inimigo+"</p>"+
    "<p><b>Dificuldade:</b> "+e.dificuldade+"</p>";

  document.getElementById("evento").className="card";
  document.getElementById("btnConcluir").className="";
  document.getElementById("recompensa").className="card hidden";
}

function concluirEvento(){
  eventosConcluidos++;
  salvarEstado();
  atualizarBarra();

  var r = recompensas[modoAtual][Math.floor(Math.random()*recompensas[modoAtual].length)];
  var rewardDiv = document.getElementById("recompensa");
  
  rewardDiv.innerHTML =
    "<h3>🎁 Recompensa</h3>"+
    "<span class='badge "+r.raridade+"'>"+r.raridade.toUpperCase()+"</span>"+
    "<p><b>Item:</b> "+r.nome+"</p>"+
    "<p><b>Tipo:</b> "+r.tipo+"</p>"+
    "<p><b>Efeito:</b> "+r.efeito+"</p>";

  rewardDiv.className="card reward-animate";
  document.getElementById("btnConcluir").className="hidden";
}

/* ================= INIT ================= */
carregarEstado();
atualizarBarra();
document.getElementById("btnGrand").onclick=function(){gerarEvento("grand")};
document.getElementById("btnNovo").onclick=function(){gerarEvento("novo")};
document.getElementById("btnConcluir").onclick=concluirEvento;
window.addEventListener("beforeunload",salvarEstado);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Line RPG – One Piece</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0b3c5d;
  --sea-dark:#07283d;
  --sea-deep:#031926;
  --gold:#f5c542;
  --accent:#90e0ef;
  --card:#001d3d;
}
body{
  margin:0;
  font-family:Roboto, sans-serif;
  color:#fff;
  background:linear-gradient(180deg,var(--sea),var(--sea-dark),var(--sea-deep));
  min-height:100vh;
  text-align:center;
}
.container{max-width:1100px;margin:auto;padding:30px}
h1{font-family:'Pirata One';font-size:3.2em;color:var(--gold);text-shadow:2px 2px 6px #000}
.subtitle{opacity:.9;margin-bottom:25px}
.mode-buttons button{
  padding:16px 28px;
  margin:10px;
  font-size:1.05em;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#ffd166);
  box-shadow:0 6px 15px rgba(0,0,0,.6);
}
.mode-buttons button.secondary{
  background:linear-gradient(135deg,#ff6b6b,#c1121f);
  color:#fff;
}
.mode-buttons button:disabled{opacity:.4;cursor:not-allowed}
.card{
  background:rgba(0,29,61,.96);
  border-radius:22px;
  padding:28px;
  margin-top:25px;
  box-shadow:0 0 25px rgba(0,0,0,.8);
  text-align:left;
}
.card h2,.card h3{text-align:center;color:var(--gold)}
.badges span{
  display:inline-block;
  background:#003566;
  padding:6px 14px;
  border-radius:20px;
  margin:4px;
  font-size:.85em
}
.description-box{
  margin-top:15px;
  padding:16px;
  background:#012a4a;
  border-radius:15px;
  line-height:1.65
}
.center{text-align:center}
.action-btn{
  margin-top:22px;
  padding:14px 28px;
  border:none;
  border-radius:25px;
  background:linear-gradient(135deg,var(--accent),#48cae4);
  font-size:1em;
  cursor:pointer
}
.timer{margin-top:18px;font-weight:bold;color:var(--accent)}
.hidden{display:none}
.reward-list li{margin:8px 0}
</style>
</head>
<body>
<div class="container">
  <h1>⚓ Grand Line RPG ⚓</h1>
  <div class="subtitle">Sistema narrativo de eventos marítimos – One Piece</div>

  <div class="mode-buttons">
    <button onclick="generateEvent('grand')">🌊 Navegar pela Grand Line</button>
    <button class="secondary" onclick="generateEvent('newworld')">🔥 Navegação do Novo Mundo</button>
  </div>

  <div id="eventCard" class="card hidden"></div>
  <div id="rewardCard" class="card hidden"></div>
  <div id="timer" class="timer"></div>
</div>

<script>
let cooldown=false;
let pendingReward=null;

/* ================= EVENTOS ================= */
const events={
  grand:[
    {
      name:"Navio da Marinha",
      rarity:"Comum",
      difficulty:"Fácil",
      description:"Velas brancas surgem no horizonte. Um navio da Marinha corta o mar com formação disciplinada. Olhares atentos vasculham as águas em busca de qualquer sinal pirata.",
      enemies:"Fuzileiros navais e um Capitão da Marinha",
      objective:"Evitar confronto ou derrotar o capitão"
    },
    {
      name:"Rei do Mar",
      rarity:"Raro",
      difficulty:"Médio",
      description:"O oceano se agita violentamente. Uma sombra colossal emerge sob o casco, seguida por um rugido capaz de gelar a espinha. Um Rei do Mar ataca sem piedade.",
      enemies:"Rei do Mar colossal",
      objective:"Sobreviver ou derrotar a criatura"
    },
    {
      name:"Thriller Bark",
      rarity:"Lendário",
      difficulty:"Difícil",
      description:"Uma névoa espessa cobre o mar. Um navio gigantesco e sombrio surge em silêncio absoluto. Risadas macabras ecoam enquanto zumbis se movem entre os conveses.",
      enemies:"Zumbis e Gecko Moria",
      objective:"Escapar do navio amaldiçoado"
    }
  ],
  newworld:[
    {
      name:"Piratas do Novo Mundo",
      rarity:"Raro",
      difficulty:"Difícil",
      description:"Um navio robusto se aproxima. A pressão no ar é sufocante — usuários de Haki observam cada movimento. Esses piratas carregam cicatrizes de inúmeras batalhas.",
      enemies:"Piratas veteranos usuários de Haki",
      objective:"Vencer o confronto ou recuar estrategicamente"
    },
    {
      name:"Território de Yonkou",
      rarity:"Lendário",
      difficulty:"Extremo",
      description:"O vento cessa abruptamente. Um peso esmagador toma conta do navio. Estas águas pertencem a um Yonkou, onde até o mar parece obedecer à sua vontade.",
      enemies:"Comandantes de elite de um Imperador dos Mares",
      objective:"Fugir com vida dessas águas"
    }
  ]
};

/* ================= RECOMPENSAS ================= */
const rewards=[
  /* ================= GRAND LINE ================= */
  {
    type:"ouro",
    name:"Bolsa de Ouro",
    rarity:"Comum",
    chance:30,
    generate:()=>{
      const gold=Math.floor(Math.random()*200)+100;
      return {
        title:`${gold} Berries`,
        details:[`Moedas obtidas: ${gold} Berries`,`Espólios coletados após escaramuças comuns da Grand Line.`]
      }
    }
  },
  {
    type:"mapa",
    name:"Mapa Antigo",
    rarity:"Raro",
    chance:20,
    generate:()=>({
      title:"Mapa Antigo da Grand Line",
      details:[
        "Mostra a localização aproximada de um navio afundado repleto de suprimentos.",
        "Pode render novos eventos ou recompensas no futuro."
      ]
    })
  },
  {
    type:"arma",
    name:"Espada Nomeada",
    rarity:"Raro",
    chance:20,
    generate:()=>({
      title:"Espada – Lâmina do Vento",
      details:[
        "Uma espada usada por um antigo espadachim da Grand Line.",
        "Leve, rápida e confiável em combates prolongados."
      ]
    })
  },
  {
    type:"fruta",
    name:"Fruta do Diabo",
    rarity:"Lendária",
    chance:5,
    generate:()=>({
      title:"Fruta do Diabo – Paramecia Rara",
      details:[
        "Concede uma habilidade especial que altera o corpo do usuário.",
        "Muito valorizada por piratas experientes."
      ]
    })
  },

  /* ================= NOVO MUNDO ================= */
  {
    type:"ouro",
    name:"Tesouro de Imperador",
    rarity:"Raro",
    chance:15,
    generate:()=>{
      const gold=Math.floor(Math.random()*2000)+3000;
      return {
        title:`${gold} Berries`,
        details:[
          `Moedas obtidas: ${gold} Berries`,
          "Tesouro tomado de territórios controlados por grandes piratas do Novo Mundo."
        ]
      }
    }
  },
  {
    type:"arma",
    name:"Arma Lendária",
    rarity:"Lendária",
    chance:10,
    generate:()=>({
      title:"Meito Suprema",
      details:[
        "Uma das lâminas de altíssimo grau, comparável às espadas dos maiores espadachins do mundo.",
        "Capaz de cortar aço e intimidar inimigos apenas com sua presença."
      ]
    })
  },
  {
    type:"fruta",
    name:"Fruta Mítica",
    rarity:"Mítica",
    chance:5,
    generate:()=>({
      title:"Fruta do Diabo – Zoan Mítica",
      details:[
        "Permite ao usuário se transformar em uma criatura lendária.",
        "Poder comparável aos comandantes de Yonkou."
      ]
    })
  },
  {
    type:"reliquia",
    name:"Relíquia do Novo Mundo",
    rarity:"Mítica",
    chance:5,
    generate:()=>({
      title:"Relíquia Antiga",
      details:[
        "Um artefato misterioso ligado ao Século Perdido.",
        "Extremamente cobiçado pelo Governo Mundial e por Yonkous."
      ]
    })
  }
];
      return {
        title:"Mapa Antigo",
        details:[maps[Math.floor(Math.random()*maps.length)],"Pode render tesouros ou novos eventos futuramente."]
      }
    }
  },
  {
    type:"arma",
    name:"Espada Nomeada",
    rarity:"Raro",
    chance:20,
    generate:()=>({
      title:"Espada – Lâmina do Vento",
      details:[
        "Uma espada bem equilibrada, inspirada em armas usadas por espadachins da Grand Line.",
        "Aumenta a eficácia em combates corpo a corpo."
      ]
    })
  },
  {
    type:"fruta",
    name:"Fruta do Diabo",
    rarity:"Lendária",
    chance:5,
    generate:()=>({
      title:"Fruta do Diabo – Logia",
      details:[
        "Uma fruta extremamente rara capaz de conceder controle total sobre um elemento natural.",
        "Poder comparável aos grandes nomes do Novo Mundo."
      ]
    })
  }
];

function weightedReward(){
  const pool=[];
  rewards.forEach(r=>{for(let i=0;i<r.chance;i++) pool.push(r)});
  return pool[Math.floor(Math.random()*pool.length)];
}

function generateEvent(mode){
  if(cooldown) return;

  const event=events[mode][Math.floor(Math.random()*events[mode].length)];
  pendingReward=weightedReward();

  document.getElementById('eventCard').classList.remove('hidden');
  document.getElementById('rewardCard').classList.add('hidden');

  document.getElementById('eventCard').innerHTML=`
    <h2>${event.name}</h2>
    <div class="badges">
      <span>Raridade: ${event.rarity}</span>
      <span>Dificuldade: ${event.difficulty}</span>
    </div>
    <div class="description-box">${event.description}</div>
    <p><b>Inimigos:</b> ${event.enemies}</p>
    <p><b>Objetivo:</b> ${event.objective}</p>
    <div class="center">
      <button class="action-btn" onclick="concludeEvent()">Concluir Evento</button>
    </div>
  `;

  startCooldown();
}

function concludeEvent(){
  const result=pendingReward.generate();
  document.getElementById('rewardCard').classList.remove('hidden');
  document.getElementById('rewardCard').innerHTML=`
    <h3>🎁 Recompensa Obtida</h3>
    <p><b>${result.title}</b></p>
    <ul class="reward-list">${result.details.map(d=>`<li>${d}</li>`).join('')}</ul>
  `;
}

function startCooldown(){
  cooldown=true;
  let time=Math.floor(Math.random()*600)+300;
  const timer=document.getElementById('timer');
  const interval=setInterval(()=>{
    timer.innerText=`⏳ Próximo evento disponível em ${time}s`;
    time--;
    if(time<=0){
      clearInterval(interval);
      cooldown=false;
      timer.innerText="⚓ Você pode navegar novamente!";
    }
  },1000);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏴‍☠️ Navegação Pirata - One Piece</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Staatliches&family=Bangers&family=Creepster&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Segoe UI', Arial, sans-serif;
  background:#000814;
  color:#fff;
  overflow-x:hidden;
  position:relative;
  min-height:100vh;
}

/* BACKGROUND OCEÂNICO ÉPICO */
.ocean-background{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(180deg, #000814 0%, #001d3d 30%, #003566 60%, #004080 100%);
  z-index:-10;
}

/* ONDAS ANIMADAS MÚLTIPLAS */
.wave{
  position:fixed;
  bottom:0;
  left:0;
  width:200%;
  height:120px;
  background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,64L48,69.3C96,75,192,85,288,80C384,75,480,53,576,48C672,43,768,53,864,58.7C960,64,1056,64,1152,58.7C1248,53,1344,43,1392,37.3L1440,32L1440,120L1392,120C1344,120,1248,120,1152,120C1056,120,960,120,864,120C768,120,672,120,576,120C480,120,384,120,288,120C192,120,96,120,48,120L0,120Z" fill="%23003566" fill-opacity="0.3"/></svg>');
  background-size:50% 100%;
  animation:wave-animation 12s linear infinite;
  z-index:-9;
}

.wave:nth-child(2){
  bottom:-10px;
  animation:wave-animation 18s linear infinite reverse;
  opacity:0.5;
  background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,32L48,42.7C96,53,192,75,288,80C384,85,480,75,576,64C672,53,768,43,864,48C960,53,1056,75,1152,80C1248,85,1344,75,1392,69.3L1440,64L1440,120L1392,120C1344,120,1248,120,1152,120C1056,120,960,120,864,120C768,120,672,120,576,120C480,120,384,120,288,120C192,120,96,120,48,120L0,120Z" fill="%23ffd60a" fill-opacity="0.2"/></svg>');
  background-size:50% 100%;
}

@keyframes wave-animation{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}

/* NUVENS FLUTUANTES */
.cloud{
  position:fixed;
  background:rgba(255,255,255,0.1);
  border-radius:100px;
  animation:float-cloud 60s linear infinite;
  z-index:-8;
}

.cloud::before, .cloud::after{
  content:'';
  position:absolute;
  background:rgba(255,255,255,0.1);
  border-radius:100px;
}

.cloud1{
  width:100px;
  height:40px;
  top:10%;
  left:-100px;
}

.cloud1::before{
  width:50px;
  height:50px;
  top:-25px;
  left:10px;
}

.cloud1::after{
  width:60px;
  height:40px;
  top:-15px;
  right:10px;
}

.cloud2{
  width:140px;
  height:50px;
  top:25%;
  left:-150px;
  animation-delay:-20s;
  animation-duration:80s;
}

.cloud2::before{
  width:70px;
  height:70px;
  top:-35px;
  left:15px;
}

.cloud2::after{
  width:80px;
  height:50px;
  top:-20px;
  right:15px;
}

@keyframes float-cloud{
  0%{left:-200px}
  100%{left:110%}
}

/* ESTRELAS PISCANDO */
.stars{
  position:fixed;
  width:100%;
  height:50%;
  top:0;
  left:0;
  z-index:-7;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:#fff;
  border-radius:50%;
  animation:twinkle 3s ease-in-out infinite;
}

@keyframes twinkle{
  0%, 100%{opacity:0.3;transform:scale(1)}
  50%{opacity:1;transform:scale(1.5)}
}

/* HEADER SUPER ÉPICO */
header{
  text-align:center;
  padding:30px 20px;
  background:
    linear-gradient(135deg, #1a0000 0%, #4a0000 50%, #8b0000 100%);
  font-family:'Pirata One', cursive;
  font-size:36px;
  font-weight:bold;
  text-shadow:
    4px 4px 0 #000,
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000,
    0 0 30px rgba(255,215,0,0.8),
    0 0 50px rgba(255,100,0,0.5);
  border-bottom:5px solid #ffd700;
  position:relative;
  box-shadow:0 10px 40px rgba(0,0,0,0.8);
  overflow:hidden;
}

header::before{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
  animation:header-glow 4s ease-in-out infinite;
}

@keyframes header-glow{
  0%, 100%{transform:scale(1)}
  50%{transform:scale(1.2)}
}

.anchor-left, .anchor-right{
  position:absolute;
  top:50%;
  font-size:45px;
  animation:anchor-swing 3s ease-in-out infinite;
  filter:drop-shadow(0 0 10px rgba(255,215,0,0.6));
}

.anchor-left{
  left:15px;
  transform:translateY(-50%);
}

.anchor-right{
  right:15px;
  transform:translateY(-50%) scaleX(-1);
  animation-delay:-1.5s;
}

@keyframes anchor-swing{
  0%, 100%{transform:translateY(-50%) rotate(-15deg)}
  50%{transform:translateY(-50%) rotate(15deg)}
}

header .title-text{
  position:relative;
  z-index:2;
  display:inline-block;
  animation:title-float 3s ease-in-out infinite;
}

@keyframes title-float{
  0%, 100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

/* ESTATÍSTICAS DO JOGADOR */
.player-stats{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px auto;
  max-width:950px;
  padding:0 20px;
  flex-wrap:wrap;
}

.stat-card{
  background:linear-gradient(135deg, rgba(255,215,0,0.2) 0%, rgba(255,140,0,0.2) 100%);
  border:3px solid #ffd700;
  border-radius:15px;
  padding:15px 25px;
  text-align:center;
  min-width:150px;
  box-shadow:0 5px 20px rgba(255,215,0,0.3);
  animation:stat-pulse 2s ease-in-out infinite;
}

@keyframes stat-pulse{
  0%, 100%{box-shadow:0 5px 20px rgba(255,215,0,0.3)}
  50%{box-shadow:0 5px 30px rgba(255,215,0,0.6)}
}

.stat-card .stat-value{
  font-size:32px;
  font-weight:bold;
  font-family:'Bangers', cursive;
  color:#ffd700;
  text-shadow:2px 2px 4px rgba(0,0,0,0.8);
}

.stat-card .stat-label{
  font-size:14px;
  color:#fff;
  margin-top:5px;
  font-family:'Staatliches', sans-serif;
}

main{
  max-width:950px;
  margin:30px auto;
  padding:20px;
}

/* BOTÕES MEGA ÉPICOS */
.nav-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  margin-bottom:30px;
}

button{
  padding:20px;
  font-size:20px;
  border:none;
  border-radius:15px;
  font-weight:bold;
  cursor:pointer;
  font-family:'Bangers', cursive;
  letter-spacing:2px;
  position:relative;
  overflow:hidden;
  transition:all 0.3s ease;
  box-shadow:0 8px 25px rgba(0,0,0,0.6);
  border:4px solid transparent;
}

#btnGrand{
  background:linear-gradient(135deg, #0066cc 0%, #0099ff 100%);
  color:#fff;
  border-color:#003d99;
}

#btnNovo{
  background:linear-gradient(135deg, #cc0000 0%, #ff3333 100%);
  color:#fff;
  border-color:#990000;
}

button::before{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  transform:translate(-50%, -50%);
  transition:width 0.6s, height 0.6s;
}

button:hover:not(:disabled)::before{
  width:300px;
  height:300px;
}

button:hover:not(:disabled){
  transform:translateY(-5px) scale(1.05);
  box-shadow:0 15px 35px rgba(0,0,0,0.8);
}

button:active:not(:disabled){
  transform:translateY(-2px) scale(1.02);
}

button:disabled{
  background:#555;
  cursor:not-allowed;
  opacity:0.5;
  filter:grayscale(1);
}

button .btn-text{
  position:relative;
  z-index:2;
}

/* CARDS PERGAMINHO PREMIUM */
.card{
  background:
    linear-gradient(135deg, #f4e4c1 0%, #e8d4a8 50%, #d4c4a0 100%);
  padding:25px;
  border-radius:20px;
  margin-top:20px;
  color:#2c1810;
  border:5px solid #8b6914;
  box-shadow:
    0 10px 35px rgba(0,0,0,0.6),
    inset 0 2px 0 rgba(255,255,255,0.4),
    inset 0 -2px 5px rgba(0,0,0,0.2);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  bottom:15px;
  border:3px dashed #8b6914;
  border-radius:15px;
  pointer-events:none;
  opacity:0.4;
}

.card::after{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:50%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation:card-shine 3s ease-in-out infinite;
}

@keyframes card-shine{
  0%{left:-100%}
  100%{left:200%}
}

.card h3{
  margin:0 0 20px 0;
  font-family:'Pirata One', cursive;
  font-size:28px;
  color:#4a0000;
  text-shadow:2px 2px 4px rgba(0,0,0,0.3);
  border-bottom:3px solid #8b6914;
  padding-bottom:10px;
  position:relative;
  z-index:1;
}

.card p{
  margin:12px 0;
  font-size:17px;
  line-height:1.8;
  position:relative;
  z-index:1;
}

.card p b{
  color:#8b0000;
  font-size:18px;
}

.hidden{display:none}

/* RARIDADES COM EFEITOS INSANOS */
.comum{
  background:linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
  color:#fff;
}
.raro{
  background:linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
  color:#fff;
  box-shadow:0 0 20px rgba(46,204,113,0.8);
  animation:rare-glow 2s ease-in-out infinite;
}
.epico{
  background:linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
  color:#fff;
  box-shadow:0 0 25px rgba(155,89,182,0.8);
  animation:epic-glow 1.8s ease-in-out infinite;
}
.lendario{
  background:linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
  color:#000;
  box-shadow:
    0 0 30px rgba(241,196,15,1),
    0 0 50px rgba(241,196,15,0.6);
  animation:legendary-glow 1.5s ease-in-out infinite;
  position:relative;
}
.lendario::before{
  content:'✨';
  position:absolute;
  top:-10px;
  right:-10px;
  font-size:24px;
  animation:sparkle-rotate 3s linear infinite;
}
.mitico{
  background:linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
  color:#fff;
  box-shadow:
    0 0 35px rgba(231,76,60,1),
    0 0 60px rgba(231,76,60,0.8),
    inset 0 0 20px rgba(255,0,0,0.3);
  animation:mythic-glow 1.2s ease-in-out infinite;
  position:relative;
}
.mitico::after{
  content:'⚡';
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:80px;
  opacity:0.1;
  animation:lightning-pulse 2s ease-in-out infinite;
}

@keyframes rare-glow{
  0%, 100%{box-shadow:0 0 20px rgba(46,204,113,0.8)}
  50%{box-shadow:0 0 35px rgba(46,204,113,1)}
}

@keyframes epic-glow{
  0%, 100%{box-shadow:0 0 25px rgba(155,89,182,0.8)}
  50%{box-shadow:0 0 40px rgba(155,89,182,1)}
}

@keyframes legendary-glow{
  0%, 100%{box-shadow:0 0 30px rgba(241,196,15,1), 0 0 50px rgba(241,196,15,0.6)}
  50%{box-shadow:0 0 45px rgba(241,196,15,1), 0 0 70px rgba(241,196,15,0.8)}
}

@keyframes mythic-glow{
  0%, 100%{box-shadow:0 0 35px rgba(231,76,60,1), 0 0 60px rgba(231,76,60,0.8)}
  50%{box-shadow:0 0 50px rgba(231,76,60,1), 0 0 80px rgba(231,76,60,1)}
}

@keyframes sparkle-rotate{
  0%{transform:rotate(0deg) scale(1)}
  50%{transform:rotate(180deg) scale(1.2)}
  100%{transform:rotate(360deg) scale(1)}
}

@keyframes lightning-pulse{
  0%, 100%{opacity:0.1;transform:translate(-50%, -50%) scale(1)}
  50%{opacity:0.3;transform:translate(-50%, -50%) scale(1.1)}
}

.badge{
  padding:8px 16px;
  border-radius:10px;
  font-size:14px;
  font-weight:bold;
  display:inline-block;
  margin-bottom:12px;
  font-family:'Bangers', cursive;
  letter-spacing:2px;
  border:3px solid rgba(0,0,0,0.4);
  text-transform:uppercase;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

/* BARRA DE PROGRESSO NAVIO PIRATA */
.progress-container{
  background:
    linear-gradient(135deg, #3d2817 0%, #5c3d2e 50%, #3d2817 100%);
  border-radius:20px;
  height:60px;
  position:relative;
  overflow:hidden;
  margin:25px 0;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.7),
    inset 0 3px 10px rgba(0,0,0,0.8);
  border:5px solid #2c1810;
}

.progress-container::before{
  content:'🌊';
  position:absolute;
  bottom:8px;
  left:15px;
  font-size:24px;
  opacity:0.5;
  animation:wave-bounce 2s ease-in-out infinite;
}

.progress-container::after{
  content:'🌊';
  position:absolute;
  bottom:8px;
  right:15px;
  font-size:24px;
  opacity:0.5;
  animation:wave-bounce 2s ease-in-out infinite reverse;
}

@keyframes wave-bounce{
  0%, 100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-8px) scale(1.1)}
}

.progress-bar{
  height:100%;
  width:0%;
  background:
    linear-gradient(90deg, 
      #ff0000 0%, 
      #ff4444 25%, 
      #ff8800 50%, 
      #ffaa00 75%, 
      #ffcc00 100%);
  background-size:300% 100%;
  transition:width 1s cubic-bezier(0.4, 0, 0.2, 1);
  animation:shimmer 4s linear infinite;
  position:relative;
  box-shadow:
    0 0 30px rgba(255,136,0,0.8),
    inset 0 2px 10px rgba(255,200,0,0.6);
}

@keyframes shimmer{
  0%{background-position:300% 0}
  100%{background-position:-300% 0}
}

.progress-bar::after{
  content:'';
  position:absolute;
  top:0;
  left:-150%;
  width:150%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  animation:shine-sweep 5s ease-in-out infinite;
}

@keyframes shine-sweep{
  0%{left:-150%}
  50%, 100%{left:250%}
}

.luffy{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  left:0%;
  font-size:40px;
  transition:left 1s cubic-bezier(0.4, 0, 0.2, 1);
  animation:luffy-run 0.5s ease-in-out infinite;
  filter:drop-shadow(4px 4px 8px rgba(0,0,0,0.8));
  z-index:10;
}

@keyframes luffy-run{
  0%, 100%{transform:translateY(-50%) translateX(0) rotate(-3deg) scale(1)}
  25%{transform:translateY(-55%) translateX(2px) rotate(-5deg) scale(1.05)}
  75%{transform:translateY(-52%) translateX(-2px) rotate(3deg) scale(0.98)}
}

.dust{
  position:absolute;
  width:12px;
  height:12px;
  background:radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
  border-radius:50%;
  animation:dustFloat 1.5s ease-out forwards;
  pointer-events:none;
  box-shadow:0 0 12px rgba(255,255,255,0.8);
}

@keyframes dustFloat{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(-50px,20px) scale(0);
    opacity:0;
  }
}

.progress-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:18px;
  font-weight:bold;
  color:#fff;
  text-shadow:
    3px 3px 6px rgba(0,0,0,1),
    -1px -1px 3px rgba(0,0,0,1);
  z-index:5;
  font-family:'Staatliches', sans-serif;
  letter-spacing:2px;
}

/* PARTÍCULAS DOURADAS */
.golden-particle{
  position:fixed;
  width:8px;
  height:8px;
  background:radial-gradient(circle, #ffd700 0%, #ff8800 100%);
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  box-shadow:0 0 10px #ffd700;
  animation:particle-float 3s ease-out forwards;
}

@keyframes particle-float{
  0%{
    transform:translate(0, 0) scale(1) rotate(0deg);
    opacity:1;
  }
  100%{
    transform:translate(var(--tx), var(--ty)) scale(0) rotate(720deg);
    opacity:0;
  }
}

/* ANIMAÇÃO DE RECOMPENSA EXPLOSIVA */
@keyframes rewardPop{
  0%{
    transform:scale(0) rotate(-360deg);
    opacity:0;
  }
  70%{
    transform:scale(1.2) rotate(20deg);
  }
  100%{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

.reward-animate{
  animation:rewardPop 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

/* BOTÃO CONCLUIR ÉPICO */
#btnConcluir{
  background:linear-gradient(135deg, #27ae60 0%, #229954 100%);
  color:#fff;
  border-color:#1e8449;
  margin-top:20px;
  width:100%;
  position:relative;
}

#btnConcluir::after{
  content:'⚔️';
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  font-size:24px;
  animation:sword-swing 1s ease-in-out infinite;
}

@keyframes sword-swing{
  0%, 100%{transform:translateY(-50%) rotate(0deg)}
  50%{transform:translateY(-50%) rotate(-20deg)}
}

#btnConcluir:hover:not(:disabled){
  background:linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
}

/* CONQUISTAS */
.achievement-popup{
  position:fixed;
  top:100px;
  right:-400px;
  background:linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
  padding:20px 30px;
  border-radius:15px;
  border:4px solid #d68910;
  box-shadow:0 10px 40px rgba(0,0,0,0.8);
  z-index:10000;
  font-family:'Bangers', cursive;
  font-size:18px;
  transition:right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.achievement-popup.show{
  right:20px;
}

.achievement-popup .achievement-title{
  font-size:14px;
  color:#fff;
  opacity:0.8;
  margin-bottom:5px;
}

.achievement-popup .achievement-text{
  font-size:22px;
  color:#fff;
  text-shadow:2px 2px 4px rgba(0,0,0,0.8);
}

/* RESPONSIVO */
@media (max-width: 600px){
  header{font-size:28px;padding:20px 10px}
  .nav-buttons{grid-template-columns:1fr}
  .anchor-left, .anchor-right{font-size:32px}
  .player-stats{flex-direction:column;gap:10px}
  .stat-card{min-width:auto}
}
</style>
</head>

<body>

<div class="ocean-background"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="stars" id="stars"></div>

<header>
  <div class="anchor-left">⚓</div>
  <div class="title-text">🏴‍☠️ NAVEGAÇÃO PIRATA 🏴‍☠️</div>
  <div class="anchor-right">⚓</div>
</header>

<div class="player-stats">
  <div class="stat-card">
    <div class="stat-value" id="totalEventos">0</div>
    <div class="stat-label">⚔️ EVENTOS</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="totalRecompensas">0</div>
    <div class="stat-label">🎁 TESOUROS</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="raridadeMax">—</div>
    <div class="stat-label">💎 MELHOR ITEM</div>
  </div>
</div>

<main>
<div class="nav-buttons">
  <button id="btnGrand"><span class="btn-text">🌊 GRAND LINE</span></button>
  <button id="btnNovo"><span class="btn-text">🔥 NOVO MUNDO</span></button>
</div>

<div class="progress-container" id="progressContainer">
  <div class="progress-bar" id="barra"></div>
  <div class="progress-text" id="progressText">0 / 5 EVENTOS</div>
  <div class="luffy" id="luffy">🏃‍♂️</div>

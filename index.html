<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece RPG – Navegação</title>
<style>
:root{
--ocean:#0a2540;--sea:#0d3b66;--gold:#f4c430;
--legendary:#ffd700;--mythic:#ff7043
}
*{box-sizing:border-box}
body{
margin:0;font-family:Trebuchet MS,sans-serif;
background:linear-gradient(180deg,var(--ocean),var(--sea));
color:#fff;min-height:100vh;display:flex;justify-content:center;padding:20px
}
.app{
max-width:900px;width:100%;background:rgba(0,0,0,.45);
border:2px solid var(--gold);border-radius:20px;padding:20px;
box-shadow:0 0 40px rgba(0,0,0,.6)
}
h1{text-align:center;color:var(--gold)}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:15px}
button{
background:linear-gradient(145deg,#f4c430,#c99b2b);
border:none;border-radius:12px;padding:12px 18px;
font-weight:bold;cursor:pointer
}
button:hover{transform:scale(1.05)}
.card{
background:rgba(0,0,0,.55);border-left:6px solid var(--gold);
border-radius:14px;padding:15px;margin-bottom:15px
}
.hidden{display:none}

/* PROGRESS BAR */
.progress-box{background:#123;border-radius:20px;padding:8px;margin:15px 0}
.progress-track{background:#001;border-radius:20px;height:24px;position:relative;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#1e90ff,#00bfff);height:100%;width:0%;transition:.5s}
.luffy{position:absolute;top:-14px;font-size:32px;transition:.5s}

@media(max-width:600px){h1{font-size:1.4rem}}
</style>
</head>
<body>
<div class="app">
<h1>🏴‍☠️ Jornada pelos Mares 🏴‍☠️</h1>

<div class="buttons">
<button onclick="start('grand')">🌊 Grand Line</button>
<button onclick="start('new')">🔥 Novo Mundo</button>
<button id="finishBtn" class="hidden" onclick="finishEvent()">⚔️ Concluir Evento</button>
</div>

<div class="progress-box">
<b>Progresso de Exploração</b>
<div class="progress-track">
<div id="progressFill" class="progress-fill"></div>
<div id="luffy" class="luffy">🏃‍♂️</div>
</div>
<p id="bonusInfo">Chance bônus: x1</p>
</div>

<div id="event" class="card hidden"></div>
<div id="reward" class="card hidden"></div>
</div>

<script>
let eventsCompleted=0;
let bonusMultiplier=1;

const rarityTable={
 grand:[
 {r:'Comum',c:60},{r:'Incomum',c:25},{r:'Raro',c:10},{r:'Épico',c:4},{r:'Lendário',c:0.9},{r:'Mítico',c:0.1}
 ],
 new:[
 {r:'Incomum',c:35},{r:'Raro',c:25},{r:'Épico',c:20},{r:'Lendário',c:15},{r:'Mítico',c:5}
 ]
};

const events={
 grand:[
 {n:'Rei do Mar',d:'Alta',t:'Uma criatura colossal surge das profundezas.'},
 {n:'Navio Fantasma',d:'Alta',t:'Almas perdidas rondam o mar.'},
 {n:'Ilha Misteriosa',d:'Média',t:'Segredos e tesouros aguardam.'}
 ],
 new:[
 {n:'Tripulação Yonko',d:'Extrema',t:'Haki esmagador domina o campo.'},
 {n:'Wano em Guerra',d:'Extrema',t:'Samurais e piratas colidem.'}
 ]
};

const rewards={
 grand:{
 Comum:[{n:'100~300 Berries',d:'Dinheiro saqueado.'}],
 Raro:[{n:'Sandai Kitetsu',d:'Espada amaldiçoada, ATQ +8'}],
 Lendário:[{n:'Mera Mera no Mi',d:'Logia – Fogo absoluto'}],
 Mítico:[{n:'Goro Goro no Mi',d:'Logia – Relâmpago divino'}]
 },
 new:{
 Épico:[{n:'Kikoku',d:'Espada amaldiçoada, ATQ +15'}],
 Lendário:[{n:'Ope Ope no Mi',d:'Paramecia suprema'}],
 Mítico:[{n:'Tori Tori no Mi – Fênix',d:'Zoan Mítica'}]
 }
};

let currentMode=null;

function rollRarity(mode){
 let roll=Math.random()*100;
 let sum=0;
 for(const e of rarityTable[mode]){
 sum+=e.c*bonusMultiplier;
 if(roll<=sum) return e.r;
 }
 return rarityTable[mode][0].r;
}

function start(mode){
 currentMode=mode;
 document.getElementById('reward').classList.add('hidden');
 const ev=events[mode][Math.floor(Math.random()*events[mode].length)];
 document.getElementById('event').innerHTML=`<h3>${ev.n}</h3><p><b>Dificuldade:</b> ${ev.d}</p><p>${ev.t}</p>`;
 document.getElementById('event').classList.remove('hidden');
 document.getElementById('finishBtn').classList.remove('hidden');
}

function finishEvent(){
 eventsCompleted++;
 if(eventsCompleted%5===0){bonusMultiplier*=2}
 updateProgress();
 const rarity=rollRarity(currentMode);
 const pool=rewards[currentMode][rarity]||rewards[currentMode].Comum;
 const item=pool[Math.floor(Math.random()*pool.length)];
 document.getElementById('reward').innerHTML=`<h3>${item.n}</h3><p><b>Raridade:</b> ${rarity}</p><p>${item.d}</p>`;
 document.getElementById('reward').classList.remove('hidden');
 document.getElementById('finishBtn').classList.add('hidden');
}

function updateProgress(){
 const percent=(eventsCompleted%5)/5*100;
 document.getElementById('progressFill').style.width=percent+'%';
 document.getElementById('luffy').style.left=`calc(${percent}% - 16px)`;
 document.getElementById('bonusInfo').innerText=`Chance bônus: x${bonusMultiplier}`;
}
</script>
</body>
</html>

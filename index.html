<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Line RPG – One Piece</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0b5ed7;
  --sea-dark:#084298;
  --sea-deep:#052c65;
  --gold:#f5c542;
  --accent:#90e0ef;
  --card:#001d3d;
}
body{
  margin:0;
  font-family:Roboto, sans-serif;
  color:#fff;
  background:linear-gradient(180deg,var(--sea),var(--sea-dark),var(--sea-deep));
  min-height:100vh;
}
.container{max-width:1100px;margin:auto;padding:30px;text-align:center}
h1{font-family:'Pirata One';font-size:3em;color:var(--gold)}
.subtitle{opacity:.9;margin-bottom:25px}
.mode-buttons button{
  padding:16px 30px;
  margin:10px;
  font-size:1.05em;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#ffd166);
}
.mode-buttons button.secondary{
  background:linear-gradient(135deg,#ff6b6b,#c1121f);
  color:#fff;
}
.card{
  background:rgba(0,29,61,.96);
  border-radius:20px;
  padding:25px;
  margin-top:25px;
  text-align:left;
}
.card h2,.card h3{text-align:center;color:var(--gold)}
.badges span{
  display:inline-block;
  background:#003566;
  padding:6px 14px;
  border-radius:20px;
  margin:4px;
  font-size:.85em
}
.description-box{margin:15px 0;padding:15px;background:#012a4a;border-radius:15px}
.center{text-align:center}
.action-btn{
  margin-top:20px;
  padding:14px 30px;
  border:none;
  border-radius:25px;
  background:linear-gradient(135deg,var(--accent),#48cae4);
  cursor:pointer;
}
.timer{margin-top:18px;font-weight:bold;color:var(--accent)}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <h1>⚓ Grand Line RPG ⚓</h1>
  <div class="subtitle">Eventos marítimos inspirados em One Piece</div>

  <div class="mode-buttons">
    <button id="btnGrand">🌊 Navegar pela Grand Line</button>
    <button id="btnNew" class="secondary">🔥 Navegação do Novo Mundo</button>
  </div>

  <div id="eventCard" class="card hidden"></div>
  <div id="rewardCard" class="card hidden"></div>
  <div id="timer" class="timer"></div>
</div>

<script>
let cooldown=false;
let currentMode=null;

const events={
  grand:[
    {name:"Navio da Marinha",rarity:"Comum",difficulty:"Fácil",description:"Um navio da Marinha surge no horizonte patrulhando as águas.",enemies:"Fuzileiros e Capitão",objective:"Evitar ou derrotar o capitão"},
    {name:"Rei do Mar",rarity:"Raro",difficulty:"Médio",description:"Uma criatura colossal emerge das profundezas atacando o navio.",enemies:"Rei do Mar",objective:"Sobreviver ou derrotá-lo"}
  ],
  newworld:[
    {name:"Piratas do Novo Mundo",rarity:"Raro",difficulty:"Difícil",description:"Piratas experientes liberam uma pressão esmagadora de Haki.",enemies:"Usuários de Haki",objective:"Vencer ou recuar"},
    {name:"Território de Yonkou",rarity:"Lendário",difficulty:"Extremo",description:"Estas águas pertencem a um Imperador dos Mares.",enemies:"Comandantes de Yonkou",objective:"Fugir com vida"}
  ]
};

const rewards={
  grand:[
    {chance:50,generate:()=>({title:`${Math.floor(Math.random()*200+100)} Berries`,details:["Ouro obtido na Grand Line."]})},
    {chance:30,generate:()=>({title:"Mapa Antigo",details:["Mostra um navio afundado."]})},
    {chance:20,generate:()=>({title:"Espada Nomeada",details:["Arma respeitável de um espadachim."]})}
  ],
  newworld:[
    {chance:40,generate:()=>({title:`${Math.floor(Math.random()*3000+3000)} Berries`,details:["Tesouro de Yonkou."]})},
    {chance:30,generate:()=>({title:"Meito Suprema",details:["Espada lendária do Novo Mundo."]})},
    {chance:30,generate:()=>({title:"Zoan Mítica",details:["Fruta lendária de poder monstruoso."]})}
  ]
};

function drawReward(mode){
  const pool=[];
  rewards[mode].forEach(r=>{for(let i=0;i<r.chance;i++) pool.push(r)});
  return pool[Math.floor(Math.random()*pool.length)].generate();
}

function generateEvent(mode){
  if(cooldown) return;
  currentMode=mode;
  const event=events[mode][Math.floor(Math.random()*events[mode].length)];
  document.getElementById('rewardCard').classList.add('hidden');
  const card=document.getElementById('eventCard');
  card.classList.remove('hidden');
  card.innerHTML=`
    <h2>${event.name}</h2>
    <div class="badges"><span>Raridade: ${event.rarity}</span><span>Dificuldade: ${event.difficulty}</span></div>
    <div class="description-box">${event.description}</div>
    <p><b>Inimigos:</b> ${event.enemies}</p>
    <p><b>Objetivo:</b> ${event.objective}</p>
    <div class="center"><button class="action-btn" id="btnConclude">Concluir Evento</button></div>
  `;
  document.getElementById('btnConclude').onclick=concludeEvent;
  startCooldown();
}

function concludeEvent(){
  const reward=drawReward(currentMode);
  const card=document.getElementById('rewardCard');
  card.classList.remove('hidden');
  card.innerHTML=`<h3>🎁 Recompensa</h3><p><b>${reward.title}</b></p><ul>${reward.details.map(d=>`<li>${d}</li>`).join('')}</ul>`;
}

function startCooldown(){
  cooldown=true;
  let time=Math.floor(Math.random()*600)+300;
  const timer=document.getElementById('timer');
  const interval=setInterval(()=>{
    timer.innerText=`⏳ Próximo evento em ${time}s`;
    time--;
    if(time<=0){clearInterval(interval);cooldown=false;timer.innerText="⚓ Pronto para navegar novamente";}
  },1000);
}

// BOTOES
window.onload=()=>{
  document.getElementById('btnGrand').onclick=()=>generateEvent('grand');
  document.getElementById('btnNew').onclick=()=>generateEvent('newworld');
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG One Piece – Navegação</title>
<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(180deg, #0a5fb4, #022b55);
  color: #fff;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
h1 { text-align: center; }
button {
  background: #f5c542;
  border: none;
  padding: 12px 18px;
  margin: 8px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
button:hover { background: #ffdd77; }
.card {
  background: rgba(0,0,0,0.35);
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}
.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
<h1>🌊 RPG One Piece – Navegação</h1>

<button id="grandBtn">Navegar pela Grand Line</button>
<button id="newBtn">Navegação do Novo Mundo</button>

<div id="evento" class="card hidden"></div>
<button id="concluir" class="hidden">Concluir Evento</button>
<div id="recompensa" class="card hidden"></div>
</div>

<script>
'use strict';

/* ================= UTIL ================= */
function sortear(lista) {
  return lista[Math.floor(Math.random() * lista.length)];
}

/* ================= EVENTOS ================= */
const eventos = {
  grand: [
    'Uma frota da Marinha surge no horizonte, patrulhando agressivamente a região.',
    'Destroços flutuam no mar, indicando uma batalha recente.',
    'Um Rei dos Mares aparece atraído pelo navio.'
  ],
  newworld: [
    'Um comandante de Yonkou bloqueia sua rota exigindo submissão.',
    'Uma ilha hostil coberta por Haki selvagem surge diante do navio.',
    'Uma tempestade anormal do Novo Mundo ameaça destruir tudo.'
  ]
};

/* ================= FRUTAS ================= */
const frutas = {
  paramecia: [
    { nome: 'Kage Kage no Mi', modelo: 'Paramecia', habilidade: 'Manipula sombras, podendo roubá-las e animar corpos.' },
    { nome: 'Horo Horo no Mi', modelo: 'Paramecia', habilidade: 'Cria fantasmas que drenam a vontade dos inimigos.' },
    { nome: 'Kilo Kilo no Mi', modelo: 'Paramecia', habilidade: 'Permite alterar o peso do corpo drasticamente.' },
    { nome: 'Sube Sube no Mi', modelo: 'Paramecia', habilidade: 'Torna o corpo extremamente escorregadio.' }
  ],
  especial: [
    { nome: 'Mochi Mochi no Mi', modelo: 'Paramecia Especial', habilidade: 'Cria e controla mochi com propriedades semelhantes a Logia.' },
    { nome: 'Ope Ope no Mi', modelo: 'Paramecia Suprema', habilidade: 'Manipulação absoluta dentro de uma área criada.' }
  ],
  zoan: [
    { nome: 'Tori Tori no Mi, Modelo: Fênix', modelo: 'Zoan Mítica', habilidade: 'Transformação em fênix com chamas regenerativas.' },
    { nome: 'Inu Inu no Mi, Modelo: Okuchi no Makami', modelo: 'Zoan Mítica', habilidade: 'Forma divina lupina com gelo e proteção espiritual.' }
  ],
  artificial: [
    { nome: 'Fruta SMILE', modelo: 'Artificial', habilidade: 'Concede poderes Zoan instáveis.' },
    { nome: 'SMILE Defeituosa', modelo: 'Artificial Falha', habilidade: 'Efeitos colaterais severos e imprevisíveis.' }
  ]
};

/* ================= RECOMPENSAS ================= */
const recompensas = {
  grand: [
    { tipo: 'Tecnica', nome: 'Tekkai Kenpo', origem: 'Rokushiki', desc: 'Endurece o corpo como aço.' },
    { tipo: 'Tecnica', nome: 'Soru', origem: 'Rokushiki', desc: 'Movimento instantâneo de alta velocidade.' },
    { tipo: 'Tecnica', nome: 'Geppo', origem: 'Rokushiki', desc: 'Permite andar no ar.' },
    { tipo: 'Item', nome: 'Cola do Franky', desc: 'Combustível altamente energético.' },
    { tipo: 'Equipamento', nome: 'Armadura de Wapolmetal', desc: 'Defesa feita de metal especial.' },
    { tipo: 'Akuma', grupo: 'paramecia' },
    { tipo: 'Navegacao', nome: 'Mapa da Grand Line', desc: 'Revela rotas perigosas e ilhas raras.' }
  ],
  newworld: [
    { tipo: 'Arma', nome: 'Nidai Kitetsu', desc: 'Espada O Wazamono de imenso poder.' },
    { tipo: 'Arma', nome: 'Kikoku', desc: 'Espada amaldiçoada usada por Trafalgar Law.' },
    { tipo: 'Arma', nome: 'Napoleon', desc: 'Homie lendário de Big Mom.' },
    { tipo: 'Equipamento', nome: 'Armadura Samurai de Wano', desc: 'Compatível com Haki.' },
    { tipo: 'Equipamento', nome: 'Armadura Germa 66', desc: 'Tecnologia militar avançada.' },
    { tipo: 'Akuma', grupo: 'especial' },
    { tipo: 'Akuma', grupo: 'zoan' },
    { tipo: 'Akuma', grupo: 'artificial' },
    { tipo: 'Habilidade', nome: 'Voz de Todas as Coisas', desc: 'Permite ouvir entidades e objetos antigos.' },
    { tipo: 'Haki', nome: 'Observação do Futuro', desc: 'Vislumbra acontecimentos futuros.' },
    { tipo: 'Relic', nome: 'Cópia do Road Poneglyph', desc: 'Indica o caminho final.' },
    { tipo: 'Relic', nome: 'Informação sobre Arma Ancestral', desc: 'Conhecimento proibido.' }
  ]
};

let modo = '';

function gerarEvento(m) {
  modo = m;
  document.getElementById('evento').innerHTML = '<h3>⚔️ Evento</h3><p>' + sortear(eventos[m]) + '</p>';
  document.getElementById('evento').classList.remove('hidden');
  document.getElementById('concluir').classList.remove('hidden');
  document.getElementById('recompensa').classList.add('hidden');
}

function concluirEvento() {
  const r = sortear(recompensas[modo]);
  let html = '<h3>🎁 Recompensa</h3>';

  if (r.tipo === 'Akuma') {
    const fruta = sortear(frutas[r.grupo]);
    html += `<p><strong>${fruta.nome}</strong></p>`;
    html += `<p>Modelo: ${fruta.modelo}</p>`;
    html += `<p>Habilidade: ${fruta.habilidade}</p>`;
  } else {
    html += `<p><strong>${r.nome}</strong></p>`;
    html += `<p>${r.desc}</p>`;
  }

  document.getElementById('recompensa').innerHTML = html;
  document.getElementById('recompensa').classList.remove('hidden');
}

window.onload = function () {
  document.getElementById('grandBtn').onclick = () => gerarEvento('grand');
  document.getElementById('newBtn').onclick = () => gerarEvento('newworld');
  document.getElementById('concluir').onclick = concluirEvento;
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navegação Pirata</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(#0a4fa3,#063b7a);
  color:white;
}
header{
  text-align:center;
  padding:20px;
  background:#042e63;
  font-size:22px;
  font-weight:bold;
}
main{
  max-width:950px;
  margin:auto;
  padding:15px;
}
button{
  width:100%;
  padding:14px;
  margin:8px 0;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#f5c542;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
.card{
  background:rgba(0,0,0,0.35);
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}
.hidden{display:none}

/* RARIDADES */
.comum{background:#95a5a6}
.raro{background:#2ecc71}
.epico{background:#9b59b6}
.lendario{background:#f1c40f;color:black}
.mitico{background:#e74c3c}

.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
  margin-bottom:6px;
}

/* PROGRESSO */
.progress-container{
  background:#003366;
  border-radius:12px;
  height:30px;
  position:relative;
  overflow:hidden;
  margin:15px 0;
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff0000,#ff9900);
  transition:width .4s;
}
.luffy{
  position:absolute;
  top:-2px;
  left:0%;
  font-size:26px;
  transition:left .4s;
}
</style>
</head>

<body>

<header>🏴‍☠️ Navegação Pirata — One Piece</header>

<main>
<button onclick="gerarEvento('grand')">🌊 Grand Line</button>
<button onclick="gerarEvento('novo')">🔥 Novo Mundo</button>

<div class="progress-container">
  <div class="progress-bar" id="barra"></div>
  <div class="luffy" id="luffy">🏃‍♂️</div>
</div>

<div id="evento" class="card hidden"></div>
<button id="btnConcluir" class="hidden" onclick="concluirEvento()">⚔️ Concluir Evento</button>
<div id="recompensa" class="card hidden"></div>
</main>

<script>
let eventosConcluidos = Number(localStorage.getItem("eventosConcluidos")) || 0;
let modoAtual = null;

/* EVENTOS */
const eventos = {
  grand:[
    {desc:"Navio da Marinha patrulha a rota.", inimigo:"Tenente da Marinha", dificuldade:"Média"},
    {desc:"Piratas rivais surgem da neblina.", inimigo:"Tripulação Pirata", dificuldade:"Baixa"},
    {desc:"Um Rei dos Mares ataca o navio.", inimigo:"Rei dos Mares", dificuldade:"Alta"}
  ],
  novo:[
    {desc:"Território de um Yonko.", inimigo:"Comandante Yonko", dificuldade:"Extrema"},
    {desc:"Ilha infestada por SMILE.", inimigo:"Piratas de Kaido", dificuldade:"Alta"},
    {desc:"Frota liderada por Almirante.", inimigo:"Almirante", dificuldade:"Letal"}
  ]
};

/* RECOMPENSAS — TODAS RESTAURADAS */
const recompensas = {
grand:[
  {nome:"Katana Comum",tipo:"Arma",raridade:"comum",efeito:"Força +5"},
  {nome:"Yubashiri",tipo:"Espada",raridade:"raro",efeito:"Força +7"},
  {nome:"Sandaí Kitetsu",tipo:"Espada",raridade:"epico",efeito:"Força +10"},
  {nome:"Clima-Tact",tipo:"Arma",raridade:"raro",efeito:"Velocidade +7"},
  {nome:"Kabuto",tipo:"Arma",raridade:"epico",efeito:"Precisão +10"},
  {nome:"Capa Pirata",tipo:"Cosmético",raridade:"comum",efeito:"Resistência +5"},
  {nome:"Casaco da Marinha",tipo:"Cosmético",raridade:"raro",efeito:"Resistência +7"},
  {nome:"Óculos de Atirador",tipo:"Cosmético",raridade:"raro",efeito:"Precisão +7"},
  {nome:"Bandana Pirata",tipo:"Cosmético",raridade:"comum",efeito:"Força +5"},
  {nome:"Braceletes de Luta",tipo:"Cosmético",raridade:"epico",efeito:"Força +10"},
  {nome:"Bara Bara no Mi",tipo:"Akuma no Mi",raridade:"epico",efeito:"Imunidade a cortes"},
  {nome:"Hana Hana no Mi",tipo:"Akuma no Mi",raridade:"lendario",efeito:"Criar membros"},
  {nome:"Doru Doru no Mi",tipo:"Akuma no Mi",raridade:"raro",efeito:"Criar cera"},
  {nome:"Bomu Bomu no Mi",tipo:"Akuma no Mi",raridade:"raro",efeito:"Explosões"},
  {nome:"Kage Kage no Mi",tipo:"Akuma no Mi",raridade:"lendario",efeito:"Manipular sombras"},
  {nome:"Horo Horo no Mi",tipo:"Akuma no Mi",raridade:"epico",efeito:"Fantasmas negativos"},
  {nome:"Inu Inu no Mi (Lobo)",tipo:"Zoan",raridade:"epico",efeito:"Força e sentidos aumentados"}
],
novo:[
  {nome:"Wado Ichimonji",tipo:"Espada",raridade:"lendario",efeito:"Força +18"},
  {nome:"Enma",tipo:"Espada",raridade:"lendario",efeito:"Força +20"},
  {nome:"Shusui",tipo:"Espada",raridade:"lendario",efeito:"Força +17"},
  {nome:"Ame no Habakiri",tipo:"Espada",raridade:"lendario",efeito:"Força +19"},
  {nome:"Griphon",tipo:"Espada",raridade:"lendario",efeito:"Força +18"},
  {nome:"Murakumogiri",tipo:"Arma",raridade:"mitico",efeito:"Força +25"},
  {nome:"Napoleon",tipo:"Arma",raridade:"mitico",efeito:"Força +22"},
  {nome:"Casaco de Yonko",tipo:"Cosmético",raridade:"lendario",efeito:"Resistência +18"},
  {nome:"Traje CP0",tipo:"Cosmético",raridade:"epico",efeito:"Velocidade +15"},
  {nome:"Manto do Barba Branca",tipo:"Cosmético",raridade:"mitico",efeito:"Força +20"},
  {nome:"Chapéu de Yonko",tipo:"Cosmético",raridade:"lendario",efeito:"Todos atributos +12"},
  {nome:"Ope Ope no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Manipular espaço"},
  {nome:"Gura Gura no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Tremores"},
  {nome:"Magu Magu no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Magma"},
  {nome:"Pika Pika no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Luz"},
  {nome:"Yami Yami no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Trevas"},
  {nome:"Hito Hito no Mi: Nika",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Liberdade absoluta"}
]
};

function salvar(){
  localStorage.setItem("eventosConcluidos",eventosConcluidos);
}

function gerarEvento(modo){
  modoAtual=modo;
  const e=eventos[modo][Math.floor(Math.random()*eventos[modo].length)];
  document.getElementById("evento").innerHTML=`
    <h3>📜 Evento</h3>
    <p><b>Descrição:</b> ${e.desc}</p>
    <p><b>Inimigo:</b> ${e.inimigo}</p>
    <p><b>Dificuldade:</b> ${e.dificuldade}</p>`;
  document.getElementById("evento").classList.remove("hidden");
  document.getElementById("btnConcluir").classList.remove("hidden");
  document.getElementById("recompensa").classList.add("hidden");
}

function concluirEvento(){
  eventosConcluidos++;
  salvar();
  atualizarBarra();
  const lista=recompensas[modoAtual];
  const r=lista[Math.floor(Math.random()*lista.length)];
  document.getElementById("recompensa").innerHTML=`
    <h3>🎁 Recompensa</h3>
    <span class="badge ${r.raridade}">${r.raridade.toUpperCase()}</span>
    <p><b>Item:</b> ${r.nome}</p>
    <p><b>Tipo:</b> ${r.tipo}</p>
    <p><b>Efeito:</b> ${r.efeito}</p>`;
  document.getElementById("recompensa").classList.remove("hidden");
  document.getElementById("btnConcluir").classList.add("hidden");
}

function atualizarBarra(){
  const p=(eventosConcluidos%5)*20;
  document.getElementById("barra").style.width=p+"%";
  document.getElementById("luffy").style.left=p+"%";
}

atualizarBarra();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Line RPG – One Piece</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<style>
body{
background:linear-gradient(#0a2540,#000814);
color:#fff;font-family:Roboto, sans-serif;
text-align:center;margin:0;padding:0
}
.container{max-width:900px;margin:auto;padding:20px}
h1{font-family:'Pirata One';font-size:3em;color:#f5c542}
button{padding:15px 25px;margin:10px;font-size:1em;border:none;border-radius:10px;background:#f5c542;color:#000;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.card{background:#001d3d;border-radius:15px;padding:20px;margin-top:20px;box-shadow:0 0 20px #000}
img{max-width:100%;border-radius:10px;margin-top:10px}
.timer{margin-top:15px;color:#90e0ef}
</style>
</head>
<body>
<div class="container">
<h1>⚓ Grand Line RPG ⚓</h1>
<p>Escolha seu tipo de navegação</p>
<button onclick="startMode('grand')">Navegar pela Grand Line</button>
<button onclick="startMode('newworld')">Navegação do Novo Mundo</button>
<div id="event" class="card" style="display:none"></div>
<div id="reward" class="card" style="display:none"></div>
<div class="timer" id="timer"></div>
</div>

<script>
let cooldown=false;

const modes={
 grand:[
  {name:"Navio da Marinha",rarity:"Comum",difficulty:"Fácil",desc:"Um navio patrulha da Marinha cruza seu caminho.",enemies:"Fuzileiros navais",objective:"Escapar ou derrotar o capitão",img:"https://i.imgur.com/2s9Z1.jpg"},
  {name:"Rei do Mar",rarity:"Raro",difficulty:"Médio",desc:"Uma criatura colossal emerge do oceano.",enemies:"Rei do Mar",objective:"Sobreviver ou caçar",img:"https://i.imgur.com/YkZyL.jpg"},
  {name:"Thriller Bark",rarity:"Lendário",difficulty:"Difícil",desc:"O navio fantasma de Gecko Moria aparece.",enemies:"Zumbis e Moria",objective:"Sobreviver ao terror",img:"https://i.imgur.com/4rX2P.jpg"}
 ],
 newworld:[
  {name:"Piratas do Novo Mundo",rarity:"Raro",difficulty:"Difícil",desc:"Piratas experientes surgem no horizonte.",enemies:"Tripulação veterana",objective:"Derrotar ou negociar",img:"https://i.imgur.com/6E8dA.jpg"},
  {name:"Yonkou Territory",rarity:"Lendário",difficulty:"Extremo",desc:"Você entrou no território de um Yonkou.",enemies:"Comandantes de elite",objective:"Fugir vivo",img:"https://i.imgur.com/8X1pA.jpg"}
 ]
};

const rewards=[
 {name:"Espada Comum",desc:"Uma lâmina simples usada por marinheiros."},
 {name:"Baú Raro",desc:"Contém ouro e itens valiosos."},
 {name:"Fruta do Diabo – Logia",desc:"Poder lendário que controla a natureza."}
];

function startMode(mode){
 if(cooldown)return;
 const event=modes[mode][Math.floor(Math.random()*modes[mode].length)];
 const reward=rewards[Math.floor(Math.random()*rewards.length)];
 document.getElementById('event').style.display='block';
 document.getElementById('event').innerHTML=`<h2>${event.name}</h2>
 <p><b>Raridade:</b> ${event.rarity}</p>
 <p><b>Dificuldade:</b> ${event.difficulty}</p>
 <p>${event.desc}</p>
 <p><b>Inimigos:</b> ${event.enemies}</p>
 <p><b>Objetivo:</b> ${event.objective}</p>
 <img src="${event.img}">`;

 document.getElementById('reward').style.display='block';
 document.getElementById('reward').innerHTML=`<h3>Recompensa</h3><p>${reward.name}</p><p>${reward.desc}</p>`;
 startCooldown();
}

function startCooldown(){
 cooldown=true;
 let time=Math.floor(Math.random()*600)+300;
 const timer=document.getElementById('timer');
 const interval=setInterval(()=>{
  timer.innerText=`Aguarde ${time}s para novo evento`;
  time--;
  if(time<=0){clearInterval(interval);cooldown=false;timer.innerText="Você pode navegar novamente!"}
 },1000);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>One Piece RPG — Eventos Marítimos</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Pirata+One&display=swap');

  body {
    margin: 0;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: linear-gradient(180deg, #0a3d62, #1e90ff, #0a3d62);
    color: #f5f6fa;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 95%;
    max-width: 950px;
    background: rgba(10, 20, 40, 0.75);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
    border: 2px solid rgba(255, 215, 0, 0.4);
  }

  h1 {
    font-family: 'Pirata One', cursive;
    font-size: 42px;
    text-align: center;
    margin-bottom: 10px;
    color: #feca57;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
  }

  h2 {
    text-align: center;
    color: #ffda79;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin: 20px 0;
    flex-wrap: wrap;
  }

  button {
    padding: 14px 22px;
    font-size: 16px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background: linear-gradient(180deg, #feca57, #ff9f43);
    color: #2f3542;
    font-weight: bold;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  button:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 0 18px rgba(254, 202, 87, 0.7);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .box {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 18px;
    margin-top: 16px;
    border-left: 5px solid #feca57;
    animation: fadeIn 0.4s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hidden {
    display: none;
  }

  .raridade-comum { color: #7bed9f; }
  .raridade-incomum { color: #70a1ff; }
  .raridade-rara { color: #a29bfe; }
  .raridade-epica { color: #ff6b81; }
  .raridade-lendaria { color: #feca57; text-shadow: 0 0 6px #feca57; }
</style>
</head>
<body>
  <div class="container">
    <h1>🌊 One Piece RPG — Navegação</h1>

    <div class="buttons">
      <button onclick="gerarEvento('GRAND_LINE')">Navegar pela Grand Line</button>
      <button onclick="gerarEvento('NOVO_MUNDO')">Navegação do Novo Mundo</button>
    </div>

    <div id="eventoBox" class="box hidden"></div>

    <div class="buttons hidden" id="concluirBox">
      <button onclick="concluirEvento()">Concluir Evento</button>
    </div>

    <div id="recompensaBox" class="box hidden"></div>
  </div>

<script>
// ================== CHANCES POR RARIDADE ==================
const RARITY_CHANCES = {
  GRAND_LINE: { comum: 50, incomum: 25, rara: 15, epica: 8, lendaria: 2 },
  NOVO_MUNDO: { comum: 20, incomum: 25, rara: 25, epica: 20, lendaria: 10 }
};

function escolherRaridade(modo) {
  const chances = RARITY_CHANCES[modo];
  let roll = Math.random() * 100;
  let acumulado = 0;
  for (const r in chances) {
    acumulado += chances[r];
    if (roll <= acumulado) return r;
  }
  return 'comum';
}

// ================== EVENTOS ==================
const EVENTOS = {
  GRAND_LINE: [
    {
      nome: 'Navio Pirata Hostil',
      dificuldade: 'Média',
      inimigos: 'Tripulação pirata armada',
      descricao: 'Um navio pirata surge no horizonte com intenções hostis.'
    },
    {
      nome: 'Rei dos Mares',
      dificuldade: 'Alta',
      inimigos: 'Rei dos Mares gigante',
      descricao: 'Uma criatura colossal emerge das profundezas do oceano.'
    },
    {
      nome: 'Navio Fantasma',
      dificuldade: 'Alta',
      inimigos: 'Espíritos amaldiçoados',
      descricao: 'Um navio abandonado navega sozinho, emanando uma aura sombria.'
    }
  ],
  NOVO_MUNDO: [
    {
      nome: 'Frota de Yonkou',
      dificuldade: 'Extrema',
      inimigos: 'Comandantes veteranos e elites',
      descricao: 'Uma frota ligada a um Yonkou bloqueia a rota marítima.'
    },
    {
      nome: 'Criatura Ancestral',
      dificuldade: 'Extrema',
      inimigos: 'Ser ancestral desconhecido',
      descricao: 'Uma criatura antiga desperta nas profundezas do Novo Mundo.'
    }
  ],
  LENDARIO: [
    {
      nome: 'Confronto com um Yonkou',
      dificuldade: 'Lendária',
      inimigos: 'Yonkou e sua guarda pessoal',
      descricao: 'Você cruza o caminho de um dos imperadores do mar.'
    },
    {
      nome: 'Ilha Perdida do Século Perdido',
      dificuldade: 'Lendária',
      inimigos: 'Guardião ancestral',
      descricao: 'Uma ilha esquecida que guarda segredos proibidos.'
    }
  ]
};

// ================== RECOMPENSAS ==================
const RECOMPENSAS = {
  GRAND_LINE: {
    comum: [
      { nome: 'Bara Bara no Mi', tipo: 'Akuma no Mi', descricao: 'Permite separar o corpo em partes.' },
      { nome: 'Bomu Bomu no Mi', tipo: 'Akuma no Mi', descricao: 'O corpo se torna uma bomba viva.' },
      { nome: 'Bandana Pirata', tipo: 'Cosmético', descricao: 'FORÇA +5.' },
      { nome: 'Katana Simples', tipo: 'Espada', descricao: 'Espada básica usada por piratas iniciantes.' }
    ],
    incomum: [
      { nome: 'Sube Sube no Mi', tipo: 'Akuma no Mi', descricao: 'O corpo se torna escorregadio.' },
      { nome: 'Sandálias do Marinheiro', tipo: 'Cosmético', descricao: 'VELOCIDADE +7.' },
      { nome: 'Yubashiri', tipo: 'Espada', descricao: 'Espada leve e bem balanceada.' }
    ],
    rara: [
      { nome: 'Supa Supa no Mi', tipo: 'Akuma no Mi', descricao: 'O corpo se transforma em lâminas.' },
      { nome: 'Kilo Kilo no Mi', tipo: 'Akuma no Mi', descricao: 'Permite alterar o peso do corpo.' },
      { nome: 'Shusui (Réplica)', tipo: 'Espada', descricao: 'Réplica da lendária espada negra.' },
      { nome: 'Capa do Capitão', tipo: 'Cosmético', descricao: 'RESISTÊNCIA +10.' }
    ],
    epica: [
      { nome: 'Doru Doru no Mi', tipo: 'Akuma no Mi', descricao: 'Cria e molda cera sólida.' },
      { nome: 'Sandai Kitetsu', tipo: 'Espada Amaldiçoada', descricao: 'Espada sedenta por sangue.' }
    ],
    lendaria: [
      { nome: 'Saber', tipo: 'Espada', descricao: 'Espada usada por Gol D. Roger.' }
    ]
  },
  NOVO_MUNDO: {
    comum: [
      { nome: 'SMILE Artificial', tipo: 'Akuma Artificial', descricao: 'Concede poder Zoan instável.' },
      { nome: 'Elmo de Wano', tipo: 'Cosmético', descricao: 'RESISTÊNCIA +10.' }
    ],
    incomum: [
      { nome: 'Ito Ito no Mi', tipo: 'Akuma no Mi', descricao: 'Cria e controla fios cortantes.' },
      { nome: 'Nidai Kitetsu', tipo: 'Espada', descricao: 'Uma das O Wazamono amaldiçoadas.' }
    ],
    rara: [
      { nome: 'Mochi Mochi no Mi', tipo: 'Akuma no Mi', descricao: 'Cria e controla mochi.' },
      { nome: 'Kikoku', tipo: 'Espada Amaldiçoada', descricao: 'Espada usada por Trafalgar Law.' }
    ],
    epica: [
      { nome: 'Tori Tori no Mi — Fênix', tipo: 'Zoan Mítica', descricao: 'Regeneração e chamas azuis.' },
      { nome: 'Armadura Germa 66', tipo: 'Equipamento', descricao: 'FORÇA +15 / VELOCIDADE +15.' }
    ],
    lendaria: [
      { nome: 'Gura Gura no Mi', tipo: 'Akuma no Mi', descricao: 'Cria terremotos devastadores.' },
      { nome: 'Napoleon', tipo: 'Homie Lendário', descricao: 'Espada viva de Big Mom.' }
    ]
  },
  LENDARIO: {
    lendaria: [
      { nome: 'Akuma no Mi Desconhecida', tipo: 'Akuma Suprema', descricao: 'Uma fruta de poder jamais registrado.' },
      { nome: 'Arma Ancestral (Informação)', tipo: 'Relíquia Proibida', descricao: 'Conhecimento sobre uma arma ancestral.' },
      { nome: 'Road Poneglyph (Cópia)', tipo: 'Relíquia', descricao: 'Indica a localização de Laugh Tale.' }
    ]
  }
};

let eventoAtual = null;
let modoAtual = null;
let recompensaAtual = null;

function gerarEvento(modo) {
  modoAtual = modo;
  const lista = EVENTOS[modo];
  eventoAtual = lista[Math.floor(Math.random() * lista.length)];

  document.getElementById('eventoBox').innerHTML = `
    <h2>${eventoAtual.nome}</h2>
    <p><strong>Dificuldade:</strong> ${eventoAtual.dificuldade}</p>
    <p><strong>Inimigos:</strong> ${eventoAtual.inimigos}</p>
    <p>${eventoAtual.descricao}</p>
  `;

  document.getElementById('eventoBox').classList.remove('hidden');
  document.getElementById('concluirBox').classList.remove('hidden');
  document.getElementById('recompensaBox').classList.add('hidden');
}

function concluirEvento() {
  const raridade = escolherRaridade(modoAtual);
  const pool = RECOMPENSAS[modoAtual][raridade];
  recompensaAtual = pool[Math.floor(Math.random() * pool.length)];

  document.getElementById('recompensaBox').innerHTML = `
    <h2>🎁 Recompensa Obtida</h2>
    <p class="raridade-${raridade}"><strong>Raridade:</strong> ${raridade.toUpperCase()}</p>
    <p><strong>${recompensaAtual.nome}</strong></p>
    <p>Tipo: ${recompensaAtual.tipo}</p>
    <p>${recompensaAtual.descricao}</p>
  `;

  document.getElementById('recompensaBox').classList.remove('hidden');
}
</script>
</body>
</html>

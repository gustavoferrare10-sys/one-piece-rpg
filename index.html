<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece RPG — Jornada Pirata</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pirata+One&display=swap');

:root {
  --ouro: #feca57;
  --mar1: #0a3d62;
  --mar2: #1e90ff;
}

body {
  margin: 0;
  font-family: 'Trebuchet MS', Arial, sans-serif;
  background: linear-gradient(180deg, var(--mar1), var(--mar2), var(--mar1));
  color: #f5f6fa;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 1100px;
  padding: 16px;
}

header {
  text-align: center;
  margin-bottom: 20px;
}

header h1 {
  font-family: 'Pirata One', cursive;
  font-size: clamp(32px, 6vw, 48px);
  color: var(--ouro);
  text-shadow: 2px 2px 10px #000;
}

header p {
  opacity: 0.9;
}

.buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

button {
  padding: 14px 20px;
  font-size: 16px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  background: linear-gradient(#ffeaa7, #fdcb6e);
  color: #2d3436;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,.6);
  transition: .2s;
}

button:hover { transform: scale(1.05); }
button:disabled { opacity: .5; cursor: not-allowed; }

.main-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 768px) {
  .main-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.card {
  background: rgba(0,0,0,.45);
  border-radius: 16px;
  padding: 16px;
  border-left: 5px solid var(--ouro);
  animation: fade .4s ease;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.hidden { display: none; }

.progress {
  height: 10px;
  background: rgba(255,255,255,.2);
  border-radius: 10px;
  overflow: hidden;
  margin: 10px 0;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #74b9ff, #0984e3);
}

.log {
  max-height: 300px;
  overflow-y: auto;
}

.log-item {
  border-bottom: 1px solid rgba(255,255,255,.1);
  padding: 6px 0;
  font-size: 14px;
}

.r-comum { color: #7bed9f; }
.r-incomum { color: #70a1ff; }
.r-rara { color: #a29bfe; }
.r-epica { color: #ff7675; }
.r-lendaria { color: var(--ouro); text-shadow: 0 0 6px var(--ouro); }
</style>
</head>
<body>

<div class="container">
<header>
  <h1>One Piece RPG</h1>
  <p>Forje sua lenda pelos mares</p>
</header>

<div class="buttons">
  <button onclick="gerarEvento('GRAND_LINE')">🌊 Grand Line</button>
  <button onclick="gerarEvento('NOVO_MUNDO')">🔥 Novo Mundo</button>
</div>

<div class="progress"><div id="progressBar" class="progress-bar"></div></div>

<div class="main-grid">
  <div id="eventoBox" class="card hidden"></div>

  <div class="card">
    <h2>📜 Histórico</h2>
    <div id="log" class="log"></div>
  </div>
</div>

<div class="buttons hidden" id="concluirBox">
  <button onclick="concluirEvento()">⚔️ Concluir Evento</button>
</div>

<div id="recompensaBox" class="card hidden"></div>
</div>

<script>
const EVENTOS = {
  GRAND_LINE: [
    { nome:'Navio Pirata', dificuldade:'Média', inimigos:'Piratas', descricao:'Um navio pirata bloqueia sua rota.' },
    { nome:'Rei dos Mares', dificuldade:'Alta', inimigos:'Monstro marinho', descricao:'Um colosso emerge do oceano.' }
  ],
  NOVO_MUNDO: [
    { nome:'Frota Yonkou', dificuldade:'Extrema', inimigos:'Comandantes', descricao:'Uma frota imperial aparece.' }
  ]
};

const RARITY = ['comum','incomum','rara','epica','lendaria'];

const RECOMPENSAS = {
  comum:[{nome:'Bandana Pirata',raridade:'comum'}],
  incomum:[{nome:'Yubashiri',raridade:'incomum'}],
  rara:[{nome:'Mochi Mochi no Mi',raridade:'rara'}],
  epica:[{nome:'Tori Tori no Mi - Fênix',raridade:'epica'}],
  lendaria:[{nome:'Gura Gura no Mi',raridade:'lendaria'}]
};

let progresso = 0;
let eventoAtual;

function gerarEvento(modo){
  eventoAtual = EVENTOS[modo][Math.floor(Math.random()*EVENTOS[modo].length)];
  document.getElementById('eventoBox').innerHTML = `<h2>${eventoAtual.nome}</h2><p><b>Dificuldade:</b> ${eventoAtual.dificuldade}</p><p><b>Inimigos:</b> ${eventoAtual.inimigos}</p><p>${eventoAtual.descricao}</p>`;
  document.getElementById('eventoBox').classList.remove('hidden');
  document.getElementById('concluirBox').classList.remove('hidden');
}

function concluirEvento(){
  progresso = Math.min(100, progresso + 20);
  document.getElementById('progressBar').style.width = progresso + '%';

  const raridade = RARITY[Math.floor(Math.random()*RARITY.length)];
  const recompensa = RECOMPENSAS[raridade][0];

  document.getElementById('recompensaBox').innerHTML = `<h2>🎁 Recompensa</h2><p class="r-${raridade}">${recompensa.nome}</p>`;
  document.getElementById('recompensaBox').classList.remove('hidden');

  const log = document.getElementById('log');
  const item = document.createElement('div');
  item.className = 'log-item r-'+raridade;
  item.innerText = recompensa.nome;
  log.prepend(item);
}
</script>
</body>
</html>

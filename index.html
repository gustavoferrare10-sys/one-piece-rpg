<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navegação Pirata - One Piece</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Staatliches&family=Bangers&display=swap');

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:#001a33;
  color:#fff;
  overflow-x:hidden;
  position:relative;
}

/* BACKGROUND ANIMADO COM ONDAS */
body::before{
  content:'';
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:
    linear-gradient(180deg, #001a33 0%, #003366 50%, #004080 100%);
  z-index:-2;
}

body::after{
  content:'';
  position:fixed;
  bottom:0;
  left:0;
  width:200%;
  height:150px;
  background:
    radial-gradient(ellipse at 50% 80%, rgba(0,100,200,0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 20% 60%, rgba(0,150,255,0.2) 0%, transparent 40%);
  animation:waves 8s ease-in-out infinite;
  z-index:-1;
}

@keyframes waves{
  0%, 100%{transform:translateX(0) translateY(0)}
  50%{transform:translateX(-50%) translateY(-10px)}
}

/* HEADER TEMÁTICO */
header{
  text-align:center;
  padding:25px 20px;
  background:linear-gradient(135deg, #1a0000 0%, #4a0000 100%);
  font-family:'Pirata One', cursive;
  font-size:32px;
  font-weight:bold;
  text-shadow:
    3px 3px 0 #000,
    -1px -1px 0 #000,
    1px -1px 0 #000,
    -1px 1px 0 #000,
    0 0 20px rgba(255,215,0,0.5);
  border-bottom:4px solid #ffd700;
  position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}

header::before{
  content:'⚓';
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  animation:swing 2s ease-in-out infinite;
}

header::after{
  content:'⚓';
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%) scaleX(-1);
  font-size:40px;
  animation:swing 2s ease-in-out infinite reverse;
}

@keyframes swing{
  0%, 100%{transform:translateY(-50%) rotate(-10deg)}
  50%{transform:translateY(-50%) rotate(10deg)}
}

main{
  max-width:950px;
  margin:30px auto;
  padding:20px;
}

/* BOTÕES ESTILIZADOS */
.nav-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:30px;
}

button{
  padding:18px;
  font-size:18px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  font-family:'Bangers', cursive;
  letter-spacing:1px;
  position:relative;
  overflow:hidden;
  transition:all 0.3s ease;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
}

#btnGrand{
  background:linear-gradient(135deg, #0066cc 0%, #0099ff 100%);
  color:#fff;
  border:3px solid #004d99;
}

#btnNovo{
  background:linear-gradient(135deg, #cc0000 0%, #ff3333 100%);
  color:#fff;
  border:3px solid #990000;
}

button::before{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
  transform:scale(0);
  transition:transform 0.5s;
}

button:hover:not(:disabled)::before{
  transform:scale(1);
}

button:hover:not(:disabled){
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

button:active:not(:disabled){
  transform:translateY(-1px);
}

button:disabled{
  background:#555;
  cursor:not-allowed;
  opacity:0.6;
}

/* CARD ESTILO PERGAMINHO */
.card{
  background:
    linear-gradient(135deg, #f4e4c1 0%, #e8d4a8 50%, #d4c4a0 100%);
  padding:20px;
  border-radius:15px;
  margin-top:15px;
  color:#2c1810;
  border:4px solid #8b6914;
  box-shadow:
    0 8px 25px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.3);
  position:relative;
  font-family:'Staatliches', sans-serif;
}

.card::before{
  content:'';
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  bottom:10px;
  border:2px dashed #8b6914;
  border-radius:10px;
  pointer-events:none;
  opacity:0.3;
}

.card h3{
  margin:0 0 15px 0;
  font-family:'Pirata One', cursive;
  font-size:26px;
  color:#4a0000;
  text-shadow:1px 1px 2px rgba(0,0,0,0.2);
  border-bottom:2px solid #8b6914;
  padding-bottom:8px;
}

.card p{
  margin:10px 0;
  font-size:16px;
  line-height:1.6;
}

.card p b{
  color:#8b0000;
  font-size:17px;
}

.hidden{display:none}

/* RARIDADES COM BRILHO */
.comum{
  background:linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
  color:#fff;
}
.raro{
  background:linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
  color:#fff;
  box-shadow:0 0 15px rgba(46,204,113,0.6);
}
.epico{
  background:linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
  color:#fff;
  box-shadow:0 0 15px rgba(155,89,182,0.6);
}
.lendario{
  background:linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
  color:#000;
  box-shadow:0 0 20px rgba(241,196,15,0.8);
  animation:legendary-glow 2s ease-in-out infinite;
}
.mitico{
  background:linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
  color:#fff;
  box-shadow:0 0 25px rgba(231,76,60,0.9);
  animation:mythic-glow 1.5s ease-in-out infinite;
}

@keyframes legendary-glow{
  0%, 100%{box-shadow:0 0 20px rgba(241,196,15,0.8)}
  50%{box-shadow:0 0 30px rgba(241,196,15,1)}
}

@keyframes mythic-glow{
  0%, 100%{box-shadow:0 0 25px rgba(231,76,60,0.9)}
  50%{box-shadow:0 0 40px rgba(231,76,60,1)}
}

.badge{
  padding:6px 12px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
  display:inline-block;
  margin-bottom:10px;
  font-family:'Bangers', cursive;
  letter-spacing:1px;
  border:2px solid rgba(0,0,0,0.3);
}

/* BARRA DE PROGRESSO ESTILO NAVIO */
.progress-container{
  background:
    linear-gradient(135deg, #3d2817 0%, #5c3d2e 100%);
  border-radius:15px;
  height:50px;
  position:relative;
  overflow:hidden;
  margin:20px 0;
  box-shadow:
    0 8px 25px rgba(0,0,0,0.5),
    inset 0 2px 8px rgba(0,0,0,0.6);
  border:4px solid #2c1810;
}

.progress-container::before{
  content:'🌊';
  position:absolute;
  bottom:5px;
  left:10px;
  font-size:20px;
  opacity:0.4;
  animation:wave-move 3s linear infinite;
}

.progress-container::after{
  content:'🌊';
  position:absolute;
  bottom:5px;
  right:10px;
  font-size:20px;
  opacity:0.4;
  animation:wave-move 3s linear infinite reverse;
}

@keyframes wave-move{
  0%, 100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, #ff4444 0%, #ff8800 50%, #ffcc00 100%);
  background-size:200% 100%;
  transition:width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  animation:shimmer 3s linear infinite;
  position:relative;
  box-shadow:0 0 20px rgba(255,136,0,0.6);
}

@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.progress-bar::after{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation:shine 4s ease-in-out infinite;
}

@keyframes shine{
  0%{left:-100%}
  50%, 100%{left:200%}
}

.luffy{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  left:0%;
  font-size:35px;
  transition:left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  animation:bounce 0.6s ease-in-out infinite;
  filter:drop-shadow(3px 3px 6px rgba(0,0,0,0.6));
  z-index:10;
}

@keyframes bounce{
  0%, 100%{transform:translateY(-50%) translateX(0) rotate(0deg)}
  50%{transform:translateY(-60%) translateX(3px) rotate(-5deg)}
}

/* PARTÍCULAS */
.dust{
  position:absolute;
  width:10px;
  height:10px;
  background:radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
  border-radius:50%;
  animation:dustFloat 1.2s ease-out forwards;
  pointer-events:none;
  box-shadow:0 0 8px rgba(255,255,255,0.6);
}

@keyframes dustFloat{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(-40px,15px) scale(0);
    opacity:0;
  }
}

.progress-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:16px;
  font-weight:bold;
  color:#fff;
  text-shadow:
    2px 2px 4px rgba(0,0,0,0.9),
    -1px -1px 2px rgba(0,0,0,0.9);
  z-index:5;
  font-family:'Staatliches', sans-serif;
  letter-spacing:1px;
}

/* ANIMAÇÃO DE RECOMPENSA */
@keyframes rewardPop{
  0%{
    transform:scale(0) rotate(-180deg);
    opacity:0;
  }
  60%{
    transform:scale(1.15) rotate(10deg);
  }
  100%{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

.reward-animate{
  animation:rewardPop 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

/* BOTÃO CONCLUIR */
#btnConcluir{
  background:linear-gradient(135deg, #27ae60 0%, #229954 100%);
  color:#fff;
  border:3px solid #1e8449;
  margin-top:15px;
  width:100%;
}

#btnConcluir:hover:not(:disabled){
  background:linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
}

/* RESPONSIVO */
@media (max-width: 600px){
  header{font-size:24px}
  .nav-buttons{grid-template-columns:1fr}
  header::before, header::after{font-size:28px}
}
</style>
</head>

<body>

<header>🏴‍☠️ NAVEGAÇÃO PIRATA 🏴‍☠️</header>

<main>
<div class="nav-buttons">
  <button id="btnGrand">🌊 GRAND LINE</button>
  <button id="btnNovo">🔥 NOVO MUNDO</button>
</div>

<div class="progress-container" id="progressContainer">
  <div class="progress-bar" id="barra"></div>
  <div class="progress-text" id="progressText">0 / 5 EVENTOS</div>
  <div class="luffy" id="luffy">🏃‍♂️</div>
</div>

<div id="evento" class="card hidden"></div>
<button id="btnConcluir" class="hidden">⚔️ CONCLUIR EVENTO</button>
<div id="recompensa" class="card hidden"></div>
</main>

<script>
/* ================= ESTADO ================= */
var eventosConcluidos = 0;
var modoAtual = null;
var cooldownFim = 0;
var COOLDOWN = 10 * 60 * 1000;

/* ================= EVENTOS ================= */
var eventos = {
  grand:[
    {desc:"Navio da Marinha patrulha a rota.", inimigo:"Tenente da Marinha", dificuldade:"Média"},
    {desc:"Piratas rivais surgem da neblina.", inimigo:"Tripulação Pirata", dificuldade:"Baixa"},
    {desc:"Um Rei dos Mares ataca o navio.", inimigo:"Rei dos Mares", dificuldade:"Alta"}
  ],
  novo:[
    {desc:"Território dominado por um Yonko.", inimigo:"Comandante Yonko", dificuldade:"Extrema"},
    {desc:"Ilha dominada por usuários de SMILE.", inimigo:"Piratas de Kaido", dificuldade:"Alta"},
    {desc:"Frota da Marinha liderada por Almirante.", inimigo:"Almirante", dificuldade:"Letal"}
  ]
};

/* ================= RECOMPENSAS (TODAS) ================= */
var recompensas = {
grand:[
  {nome:"Katana Comum",tipo:"Arma",raridade:"comum",efeito:"Força +5"},
  {nome:"Yubashiri",tipo:"Espada",raridade:"raro",efeito:"Força +7"},
  {nome:"Sandaí Kitetsu",tipo:"Espada",raridade:"epico",efeito:"Força +10"},
  {nome:"Clima-Tact",tipo:"Arma",raridade:"raro",efeito:"Velocidade +7"},
  {nome:"Kabuto",tipo:"Arma",raridade:"epico",efeito:"Precisão +10"},
  {nome:"Martelo de Guerra",tipo:"Arma",raridade:"comum",efeito:"Força +6"},
  {nome:"Lança Pirata",tipo:"Arma",raridade:"raro",efeito:"Força +8"},
  {nome:"Punhos de Ferro",tipo:"Arma",raridade:"epico",efeito:"Força +9"},
  {nome:"Capa Pirata",tipo:"Cosmético",raridade:"comum",efeito:"Resistência +5"},
  {nome:"Casaco da Marinha",tipo:"Cosmético",raridade:"raro",efeito:"Resistência +7"},
  {nome:"Óculos de Atirador",tipo:"Cosmético",raridade:"raro",efeito:"Precisão +7"},
  {nome:"Bandana Pirata",tipo:"Cosmético",raridade:"comum",efeito:"Força +5"},
  {nome:"Braceletes de Luta",tipo:"Cosmético",raridade:"epico",efeito:"Força +10"},
  {nome:"Botas de Navegação",tipo:"Cosmético",raridade:"raro",efeito:"Velocidade +6"},
  {nome:"Capa de Explorador",tipo:"Cosmético",raridade:"raro",efeito:"Velocidade +7"},
  {nome:"Bara Bara no Mi",tipo:"Akuma no Mi",raridade:"epico",efeito:"Imunidade a cortes"},
  {nome:"Hana Hana no Mi",tipo:"Akuma no Mi",raridade:"lendario",efeito:"Criar membros"},
  {nome:"Doru Doru no Mi",tipo:"Akuma no Mi",raridade:"raro",efeito:"Criar cera"},
  {nome:"Bomu Bomu no Mi",tipo:"Akuma no Mi",raridade:"raro",efeito:"Explosões corporais"},
  {nome:"Sube Sube no Mi",tipo:"Akuma no Mi",raridade:"raro",efeito:"Corpo escorregadio"},
  {nome:"Kage Kage no Mi",tipo:"Akuma no Mi",raridade:"lendario",efeito:"Manipular sombras"},
  {nome:"Horo Horo no Mi",tipo:"Akuma no Mi",raridade:"epico",efeito:"Fantasmas negativos"},
  {nome:"Inu Inu no Mi (Lobo)",tipo:"Zoan",raridade:"epico",efeito:"Força e sentidos aumentados"},
  {nome:"Mogu Mogu no Mi",tipo:"Zoan",raridade:"raro",efeito:"Escavação extrema"}
],

novo:[
  {nome:"Wado Ichimonji",tipo:"Espada",raridade:"lendario",efeito:"Força +18"},
  {nome:"Enma",tipo:"Espada",raridade:"lendario",efeito:"Força +20"},
  {nome:"Shusui",tipo:"Espada",raridade:"lendario",efeito:"Força +17"},
  {nome:"Ame no Habakiri",tipo:"Espada",raridade:"lendario",efeito:"Força +19"},
  {nome:"Griphon",tipo:"Espada",raridade:"lendario",efeito:"Força +18"},
  {nome:"Murakumogiri",tipo:"Arma",raridade:"mitico",efeito:"Força +25"},
  {nome:"Napoleon",tipo:"Arma",raridade:"mitico",efeito:"Força +22"},
  {nome:"Bisento do Barba Branca",tipo:"Arma",raridade:"mitico",efeito:"Força +24"},
  {nome:"Casaco de Yonko",tipo:"Cosmético",raridade:"lendario",efeito:"Resistência +18"},
  {nome:"Traje CP0",tipo:"Cosmético",raridade:"epico",efeito:"Velocidade +15"},
  {nome:"Manto do Barba Branca",tipo:"Cosmético",raridade:"mitico",efeito:"Força +20"},
  {nome:"Chapéu de Yonko",tipo:"Cosmético",raridade:"lendario",efeito:"Todos atributos +12"},
  {nome:"Traje Samurai de Wano",tipo:"Cosmético",raridade:"epico",efeito:"Força +15"},
  {nome:"Roupa Tecnológica Germa 66",tipo:"Cosmético",raridade:"lendario",efeito:"Velocidade +20"},
  {nome:"Luvas de Haki Avançado",tipo:"Cosmético",raridade:"mitico",efeito:"Força +22"},
  {nome:"Ope Ope no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Manipular espaço"},
  {nome:"Gura Gura no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Tremores destrutivos"},
  {nome:"Magu Magu no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Magma absoluto"},
  {nome:"Pika Pika no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Velocidade da luz"},
  {nome:"Yami Yami no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Trevas"},
  {nome:"Soru Soru no Mi",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Manipular almas"},
  {nome:"Uo Uo no Mi: Seiryu",tipo:"Zoan Mítica",raridade:"mitico",efeito:"Dragão lendário"},
  {nome:"Tori Tori no Mi: Fênix",tipo:"Zoan Mítica",raridade:"mitico",efeito:"Regeneração total"},
  {nome:"Nikyu Nikyu no Mi",tipo:"Akuma no Mi",raridade:"lendario",efeito:"Repelir tudo"},
  {nome:"Hito Hito no Mi: Nika",tipo:"Akuma no Mi",raridade:"mitico",efeito:"Liberdade absoluta"}
]
};

/* ================= SALVAMENTO ================= */
function salvarEstado(){
  localStorage.setItem("eventosConcluidos", String(eventosConcluidos));
  localStorage.setItem("cooldownFim", String(cooldownFim));
}

function carregarEstado(){
  var e = localStorage.getItem("eventosConcluidos");
  var c = localStorage.getItem("cooldownFim");
  eventosConcluidos = e ? parseInt(e,10) : 0;
  cooldownFim = c ? parseInt(c,10) : 0;
}

/* ================= ANIMAÇÕES ================= */
function criarPoeira(){
  var container = document.getElementById("progressContainer");
  var luffy = document.getElementById("luffy");
  var rect = luffy.getBoundingClientRect();
  var containerRect = container.getBoundingClientRect();
  
  var dust = document.createElement("div");
  dust.className = "dust";
  dust.style.left = (rect.left - containerRect.left) + "px";
  dust.style.top = (rect.top - containerRect.top + 15) + "px";
  
  container.appendChild(dust);
  
  setTimeout(function(){
    container.removeChild(dust);
  }, 1200);
}

var dustInterval = null;

function iniciarAnimacaoPoeira(){
  pararAnimacaoPoeira();
  dustInterval = setInterval(criarPoeira, 150);
}

function pararAnimacaoPoeira(){
  if(dustInterval){
    clearInterval(dustInterval);
    dustInterval = null;
  }
}

/* ================= UI ================= */
function atualizarBarra(){
  var progresso = eventosConcluidos % 5;
  var p = progresso * 20;
  
  document.getElementById("barra").style.width = p + "%";
  document.getElementById("luffy").style.left = (p === 0 ? 0 : p - 2) + "%";
  document.getElementById("progressText").textContent = progresso + " / 5 EVENTOS";
  
  if(p > 0){
    iniciarAnimacaoPoeira();
    setTimeout(pararAnimacaoPoeira, 1000);
  }
}

function podeAgir(){
  return Date.now() >= cooldownFim;
}

/* ================= LÓGICA ================= */
function gerarEvento(modo){
  if(!podeAgir()){
    alert("⏰ Aguarde 10 minutos para o próximo evento!");
    return;
  }
  modoAtual = modo;
  cooldownFim = Date.now() + COOLDOWN;
  salvarEstado();

  var e = eventos[modo][Math.floor(Math.random()*eventos[modo].length)];
  document.getElementById("evento").innerHTML =
    "<h3>📜 EVENTO ENCONTRADO</h3>"+
    "<p><b>Descrição:</b> "+e.desc+"</p>"+
    "<p><b>Inimigo:</b> "+e.inimigo+"</p>"+
    "<p><b>Dificuldade:</b> "+e.dificuldade+"</p>";

  document.getElementById("evento").className="card";
  document.getElementById("btnConcluir").className="";
  document.getElementById("recompensa").className="card hidden";
}

function concluirEvento(){
  eventosConcluidos++;
  salvarEstado();
  atualizarBarra();

  var r = recompensas[modoAtual][Math.floor(Math.random()*recompensas[modoAtual].length)];
  var rewardDiv = document.getElementById("recompensa");
  
  rewardDiv.innerHTML =
    "<h3>🎁 RECOMPENSA CONQUISTADA!</h3>"+
    "<span class='badge "+r.raridade+"'>"+r.raridade.toUpperCase()+"</span>"+
    "<p><b>Item:</b> "+r.nome+"</p>"+
    "<p><b>Tipo:</b> "+r.tipo+"</p>"+
    "<p><b>Efeito:</b> "+r.efeito+"</p>";

  rewardDiv.className="card reward-animate";
  document.getElementById("btnConcluir").className="hidden";
}

/* ================= INIT ================= */
carregarEstado();
atualizarBarra();
document.getElementById("btnGrand").onclick=function(){gerarEvento("grand")};
document.getElementById("btnNovo").onclick=function(){gerarEvento("novo")};
document.getElementById("btnConcluir").onclick=concluirEvento;
window.addEventListener("beforeunload",salvarEstado);
</script>

</body>
</html>

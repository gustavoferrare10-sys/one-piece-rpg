<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG One Piece - Navegação</title>
<style>
body {
  margin: 0;
  font-family: 'Trebuchet MS', Arial, sans-serif;
  background: linear-gradient(#0a4fa3, #021f3f);
  color: #fff;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
h1 {
  text-align: center;
}
button {
  background: #f5c542;
  border: none;
  padding: 12px 20px;
  margin: 10px 5px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
button:hover { background: #ffd966; }
.card {
  background: rgba(0,0,0,0.35);
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}
.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
<h1>🌊 RPG One Piece – Navegação</h1>

<button id="grandLineBtn">Navegar pela Grand Line</button>
<button id="newWorldBtn">Navegação do Novo Mundo</button>

<div id="evento" class="card hidden"></div>
<button id="concluirBtn" class="hidden">Concluir Evento</button>
<div id="recompensa" class="card hidden"></div>
</div>

<script>
const frutas = {
  comum: [
    {
      nome: 'Bara Bara no Mi',
      modelo: 'Paramecia',
      habilidades: 'Permite ao usuário separar o próprio corpo em partes independentes, tornando-o imune a ataques cortantes.'
    },
    {
      nome: 'Sube Sube no Mi',
      modelo: 'Paramecia',
      habilidades: 'Deixa o corpo escorregadio, fazendo ataques físicos deslizar e aumentando mobilidade.'
    }
  ],
  rara: [
    {
      nome: 'Tori Tori no Mi, Modelo: Falcão',
      modelo: 'Zoan',
      habilidades: 'Permite se transformar em um falcão ou forma híbrida, concedendo voo e visão aguçada.'
    },
    {
      nome: 'Ope Ope no Mi',
      modelo: 'Paramecia',
      habilidades: 'Cria uma área onde o usuário pode manipular tudo livremente, incluindo corpos e objetos.'
    }
  ],
  lendaria: [
    {
      nome: 'Hito Hito no Mi, Modelo: Nika',
      modelo: 'Zoan Mítica',
      habilidades: 'Concede um corpo de borracha e liberdade total de combate, com poderes que desafiam a realidade.'
    },
    {
      nome: 'Goro Goro no Mi',
      modelo: 'Logia',
      habilidades: 'Permite criar, controlar e se transformar em eletricidade.'
    }
  ]
};

const recompensas = {
  grandline: [
    { tipo: 'Espada', nome: 'Sandai Kitetsu', desc: 'Uma Meito amaldiçoada de alto poder ofensivo.' },
    { tipo: 'Fruta', raridade: 'comum' },
    { tipo: 'Baú', desc: 'Baú com 5.000 a 15.000 Berries em ouro.' }
  ],
  newworld: [
    { tipo: 'Espada', nome: 'Gryphon', desc: 'A lendária espada de Shanks, irradiando Haki.' },
    { tipo: 'Fruta', raridade: 'lendaria' },
    { tipo: 'Relíquia', desc: 'Fragmento de Poneglyph com segredos do Século Perdido.' }
  ]
};

function sortear(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

let modoAtual = '';

function gerarEvento(modo) {
  modoAtual = modo;
  document.getElementById('evento').innerHTML = `<h3>⚔️ Evento Gerado</h3><p>Você encontrou uma ameaça marítima perigosa durante sua navegação.</p>`;
  document.getElementById('evento').classList.remove('hidden');
  document.getElementById('concluirBtn').classList.remove('hidden');
  document.getElementById('recompensa').classList.add('hidden');
}

function concluirEvento() {
  const recompensa = sortear(recompensas[modoAtual]);
  let texto = '<h3>🎁 Recompensa Obtida</h3>';

  if (recompensa.tipo === 'Fruta') {
    const fruta = sortear(frutas[recompensa.raridade]);
    texto += `<p><strong>Fruta do Diabo:</strong> ${fruta.nome}</p>`;
    texto += `<p><strong>Modelo:</strong> ${fruta.modelo}</p>`;
    texto += `<p><strong>Habilidades:</strong> ${fruta.habilidades}</p>`;
  } else {
    texto += `<p><strong>${recompensa.nome || recompensa.tipo}</strong></p><p>${recompensa.desc}</p>`;
  }

  document.getElementById('recompensa').innerHTML = texto;
  document.getElementById('recompensa').classList.remove('hidden');
}

window.onload = () => {
  document.getElementById('grandLineBtn').onclick = () => gerarEvento('grandline');
  document.getElementById('newWorldBtn').onclick = () => gerarEvento('newworld');
  document.getElementById('concluirBtn').onclick = concluirEvento;
};
</script>
</body>
</html>

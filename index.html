<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Line RPG – One Piece</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea-light:#1e6091;
  --sea:#0a2540;
  --sea-deep:#000814;
  --gold:#f5c542;
  --accent:#90e0ef;
  --card:#001d3d;
}
body{
  margin:0;
  font-family:Roboto, sans-serif;
  color:#fff;
  background:linear-gradient(180deg,var(--sea-light),var(--sea),var(--sea-deep));
  min-height:100vh;
  text-align:center;
}
.container{max-width:1100px;margin:auto;padding:30px}
h1{font-family:'Pirata One';font-size:3.2em;color:var(--gold);text-shadow:2px 2px 6px #000}
.subtitle{opacity:.9;margin-bottom:25px}
.mode-buttons button{
  padding:16px 28px;
  margin:10px;
  font-size:1.05em;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#ffd166);
  box-shadow:0 6px 15px rgba(0,0,0,.6);
}
.mode-buttons button.secondary{
  background:linear-gradient(135deg,#ff6b6b,#c1121f);
  color:#fff;
}
.mode-buttons button:disabled{opacity:.4;cursor:not-allowed}
.card{
  background:rgba(0,29,61,.95);
  border-radius:22px;
  padding:28px;
  margin-top:25px;
  box-shadow:0 0 25px rgba(0,0,0,.8);
  text-align:left;
}
.card h2,.card h3{text-align:center;color:var(--gold)}
.badges span{
  display:inline-block;
  background:#003566;
  padding:6px 14px;
  border-radius:20px;
  margin:4px;
  font-size:.85em
}
.center{text-align:center}
.action-btn{
  margin-top:20px;
  padding:14px 26px;
  border:none;
  border-radius:25px;
  background:linear-gradient(135deg,var(--accent),#48cae4);
  font-size:1em;
  cursor:pointer
}
.timer{margin-top:18px;font-weight:bold;color:var(--accent)}
.hidden{display:none}
.description-box{
  margin-top:15px;
  padding:15px;
  background:#012a4a;
  border-radius:15px;
  line-height:1.6
}
</style>
</head>
<body>
<div class="container">
  <h1>⚓ Grand Line RPG ⚓</h1>
  <div class="subtitle">Sistema de Eventos Marítimos inspirado em One Piece</div>

  <div class="mode-buttons">
    <button onclick="generateEvent('grand')">🌊 Navegar pela Grand Line</button>
    <button class="secondary" onclick="generateEvent('newworld')">🔥 Navegação do Novo Mundo</button>
  </div>

  <div id="eventCard" class="card hidden"></div>
  <div id="rewardCard" class="card hidden"></div>
  <div id="timer" class="timer"></div>
</div>

<script>
let cooldown=false;
let pendingReward=null;

const events={
  grand:[
    {
      name:"Navio da Marinha",
      rarity:"Comum",
      difficulty:"Fácil",
      description:"No horizonte, velas brancas surgem contra o céu. Um navio da Marinha corta as ondas com disciplina rígida. Os fuzileiros observam atentamente, prontos para agir caso identifiquem qualquer bandeira pirata. O clima é tenso, mas ainda controlável.",
      enemies:"Fuzileiros navais e um Capitão da Marinha",
      objective:"Passar despercebido ou derrotar o capitão para continuar a rota"
    },
    {
      name:"Rei do Mar",
      rarity:"Raro",
      difficulty:"Médio",
      description:"As águas começam a borbulhar e o mar se agita violentamente. Uma sombra gigantesca se move sob o navio antes de emergir em um rugido ensurdecedor. O Rei do Mar ataca sem piedade, testando a coragem e a força da tripulação.",
      enemies:"Um Rei do Mar colossal",
      objective:"Sobreviver ao ataque ou derrotar a criatura"
    },
    {
      name:"Thriller Bark",
      rarity:"Lendário",
      difficulty:"Difícil",
      description:"Uma névoa espessa cobre o mar, abafando sons e sentidos. De repente, um gigantesco navio fantasma surge silenciosamente. Risadas distantes ecoam enquanto zumbis se movimentam nas sombras. Algo terrível observa cada passo da tripulação.",
      enemies:"Zumbis e o Shichibukai Gecko Moria",
      objective:"Escapar do navio amaldiçoado com vida"
    }
  ],
  newworld:[
    {
      name:"Piratas do Novo Mundo",
      rarity:"Raro",
      difficulty:"Difícil",
      description:"O mar parece mais pesado, quase hostil. Um navio imponente se aproxima, carregando uma tripulação experiente marcada por batalhas. A pressão do Haki é palpável, deixando claro que estes piratas não são adversários comuns.",
      enemies:"Piratas veteranos usuários de Haki",
      objective:"Vencer o confronto ou forçar uma retirada estratégica"
    },
    {
      name:"Território de Yonkou",
      rarity:"Lendário",
      difficulty:"Extremo",
      description:"O vento muda repentinamente e o céu escurece. Todos a bordo sentem um peso esmagador no ar. Estas águas pertencem a um Yonkou, e qualquer erro pode significar aniquilação. Cada decisão aqui define o destino da tripulação.",
      enemies:"Comandantes de elite de um Imperador dos Mares",
      objective:"Escapar dessas águas sem ser destruído"
    }
  ]
};

const rewards=[
  {name:"Espada Comum",rarity:"Comum",description:"Uma lâmina simples, forjada para marinheiros e piratas iniciantes.",chance:40},
  {name:"Baú Raro",rarity:"Raro",description:"Um baú reforçado contendo ouro, mapas antigos e itens valiosos.",chance:25},
  {name:"Fruta do Diabo – Logia",rarity:"Lendária",description:"Uma fruta extremamente rara que concede o poder de se transformar e controlar um elemento natural.",chance:5}
];

function weightedReward(){
  const pool=[];
  rewards.forEach(r=>{for(let i=0;i<r.chance;i++) pool.push(r)});
  return pool[Math.floor(Math.random()*pool.length)];
}

function generateEvent(mode){
  if(cooldown) return;

  const event=events[mode][Math.floor(Math.random()*events[mode].length)];
  pendingReward=weightedReward();

  document.getElementById('eventCard').classList.remove('hidden');
  document.getElementById('rewardCard').classList.add('hidden');

  document.getElementById('eventCard').innerHTML=`
    <h2>${event.name}</h2>
    <div class="badges">
      <span>Raridade: ${event.rarity}</span>
      <span>Dificuldade: ${event.difficulty}</span>
    </div>
    <div class="description-box">${event.description}</div>
    <p><b>Inimigos:</b> ${event.enemies}</p>
    <p><b>Objetivo:</b> ${event.objective}</p>
    <div class="center">
      <button class="action-btn" onclick="concludeEvent()">Concluir Evento</button>
    </div>
  `;

  startCooldown();
}

function concludeEvent(){
  document.getElementById('rewardCard').classList.remove('hidden');
  document.getElementById('rewardCard').innerHTML=`
    <h3>🎁 Recompensa Obtida</h3>
    <p><b>${pendingReward.name}</b></p>
    <p>Raridade: ${pendingReward.rarity}</p>
    <p>${pendingReward.description}</p>
  `;
}

function startCooldown(){
  cooldown=true;
  let time=Math.floor(Math.random()*600)+300;
  const timer=document.getElementById('timer');
  const interval=setInterval(()=>{
    timer.innerText=`⏳ Próximo evento disponível em ${time}s`;
    time--;
    if(time<=0){
      clearInterval(interval);
      cooldown=false;
      timer.innerText="⚓ Você pode navegar novamente!";
    }
  },1000);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navegação Pirata</title>

<style>
:root{
  --mar:#0a4fa3;
  --mar-escuro:#063b7a;
  --dourado:#f5c542;
  --branco:#ffffff;
}

*{
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  margin:0;
  background:linear-gradient(to bottom, var(--mar), var(--mar-escuro));
  color:var(--branco);
}

header{
  text-align:center;
  padding:20px;
  background:#042e63;
  font-size:22px;
  font-weight:bold;
}

main{
  padding:15px;
  max-width:800px;
  margin:auto;
}

button{
  width:100%;
  padding:14px;
  margin:8px 0;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:var(--dourado);
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#888;
  cursor:not-allowed;
}

.card{
  background:rgba(0,0,0,0.3);
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}

.hidden{
  display:none;
}

.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
  margin-bottom:5px;
}

.raro{background:#2ecc71;}
.epico{background:#9b59b6;}
.lendario{background:#f1c40f;color:#000;}
.mitico{background:#e74c3c;}

.progress{
  background:#003366;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progress-bar{
  height:20px;
  width:0%;
  background:#ff0000;
  transition:width 0.4s;
}
</style>
</head>

<body>

<header>🏴‍☠️ Navegação Pirata — One Piece</header>

<main>

<button onclick="iniciarModo('grand')">🌊 Navegar pela Grand Line</button>
<button onclick="iniciarModo('novo')">🔥 Navegação do Novo Mundo</button>

<div class="progress">
  <div class="progress-bar" id="barra"></div>
</div>

<div id="evento" class="card hidden"></div>
<button id="concluir" class="hidden" onclick="concluirEvento()">⚔️ Concluir Evento</button>
<div id="recompensa" class="card hidden"></div>

</main>

<script>
let modoAtual = null;
let eventosConcluidos = 0;
let eventoGerado = null;
let proximoTempo = 0;

const eventos = {
  grand:[
    {desc:"Um navio da Marinha patrulha a região.", inimigo:"Capitão da Marinha", dificuldade:"Média"},
    {desc:"Piratas rivais atacam durante a neblina.", inimigo:"Piratas da Grand Line", dificuldade:"Baixa"},
    {desc:"Uma criatura marinha colossal surge.", inimigo:"Rei dos Mares", dificuldade:"Alta"}
  ],
  novo:[
    {desc:"Um comandante de Yonko bloqueia o caminho.", inimigo:"Comandante do Novo Mundo", dificuldade:"Extrema"},
    {desc:"Uma ilha dominada por SMILEs defeituosas.", inimigo:"Piratas de Kaido", dificuldade:"Alta"},
    {desc:"Território proibido da Marinha.", inimigo:"Almirante", dificuldade:"Letal"}
  ]
};

const recompensas = {
  grand:[
    {nome:"Katana Comum", tipo:"Espada", raridade:"raro", bonus:"Força +7"},
    {nome:"Mapa da Grand Line", tipo:"Mapa", raridade:"epico", bonus:"Revela rotas raras"},
    {nome:"Kilo Kilo no Mi", tipo:"Akuma no Mi", raridade:"lendario", bonus:"Manipula peso"}
  ],
  novo:[
    {nome:"Nidai Kitetsu", tipo:"Espada", raridade:"epico", bonus:"Força +15"},
    {nome:"Mochi Mochi no Mi", tipo:"Akuma no Mi", raridade:"lendario", bonus:"Corpo de mochi + visão futura"},
    {nome:"Hito Hito no Mi: Nika", tipo:"Akuma no Mi", raridade:"mitico", bonus:"Liberdade absoluta"}
  ]
};

function iniciarModo(modo){
  const agora = Date.now();
  if(agora < proximoTempo){
    const min = Math.ceil((proximoTempo-agora)/60000);
    alert("Aguarde "+min+" minutos para o próximo evento.");
    return;
  }

  modoAtual = modo;
  const lista = eventos[modo];
  eventoGerado = lista[Math.floor(Math.random()*lista.length)];

  document.getElementById("evento").innerHTML = `
    <h3>📜 Evento</h3>
    <p><b>Descrição:</b> ${eventoGerado.desc}</p>
    <p><b>Inimigo:</b> ${eventoGerado.inimigo}</p>
    <p><b>Dificuldade:</b> ${eventoGerado.dificuldade}</p>
  `;

  document.getElementById("evento").classList.remove("hidden");
  document.getElementById("concluir").classList.remove("hidden");
  document.getElementById("recompensa").classList.add("hidden");
}

function concluirEvento(){
  eventosConcluidos++;
  atualizarBarra();

  const lista = recompensas[modoAtual];
  const recompensa = lista[Math.floor(Math.random()*lista.length)];

  document.getElementById("recompensa").innerHTML = `
    <h3>🎁 Recompensa</h3>
    <span class="badge ${recompensa.raridade}">${recompensa.raridade.toUpperCase()}</span>
    <p><b>Item:</b> ${recompensa.nome}</p>
    <p><b>Tipo:</b> ${recompensa.tipo}</p>
    <p><b>Efeito:</b> ${recompensa.bonus}</p>
  `;

  document.getElementById("recompensa").classList.remove("hidden");
  document.getElementById("concluir").classList.add("hidden");

  const tempo = (Math.floor(Math.random()*11)+5)*60000;
  proximoTempo = Date.now()+tempo;
}

function atualizarBarra(){
  let progresso = (eventosConcluidos%5)*20;
  document.getElementById("barra").style.width = progresso+"%";
}
</script>

</body>
</html>

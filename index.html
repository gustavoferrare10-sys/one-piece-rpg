<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG One Piece – Sistema Completo</title>
<style>
body {
  margin: 0;
  font-family: 'Trebuchet MS', Arial, sans-serif;
  background: linear-gradient(180deg, #0a66c2, #02284d);
  color: #fff;
}
.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}
h1, h2 { text-align: center; }
button {
  background: #f5c542;
  border: none;
  padding: 12px 20px;
  margin: 6px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
}
button:hover { background: #ffe08a; }
.card {
  background: rgba(0,0,0,0.4);
  padding: 18px;
  border-radius: 12px;
  margin-top: 16px;
}
.hidden { display: none; }
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  background: #1e90ff;
  font-size: 12px;
  margin-right: 5px;
}
</style>
</head>
<body>
<div class="container">
<h1>🌊 RPG One Piece – Sistema de Navegação</h1>

<div style="text-align:center">
<button id="grandBtn">🌊 Grand Line</button>
<button id="newBtn">🔥 Novo Mundo</button>
</div>

<div id="evento" class="card hidden"></div>
<button id="concluir" class="hidden">⚔️ Concluir Evento</button>
<div id="recompensa" class="card hidden"></div>
</div>

<script>
'use strict';

/* ================= UTIL ================= */
function rand(lista) { return lista[Math.floor(Math.random() * lista.length)]; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

/* ================= EVENTOS ================= */
const eventos = {
  grand: [
    { nome: 'Frota da Marinha', dificuldade: 'Média', inimigos: 'Capitão da Marinha e seus fuzileiros', desc: 'Navios da Marinha cercam sua embarcação exigindo rendição.' },
    { nome: 'Rei dos Mares', dificuldade: 'Alta', inimigos: 'Criatura colossal marinha', desc: 'Um monstro gigantesco emerge das profundezas atacando o navio.' },
    { nome: 'Ilha Perigosa', dificuldade: 'Baixa', inimigos: 'Fauna hostil', desc: 'Uma ilha desconhecida repleta de armadilhas naturais.' }
  ],
  newworld: [
    { nome: 'Comandante de Yonkou', dificuldade: 'Extrema', inimigos: 'Pirata de elite com Haki avançado', desc: 'Um comandante de um Yonkou decide testar sua força.' },
    { nome: 'Ilha de Haki Selvagem', dificuldade: 'Alta', inimigos: 'Guerreiros locais', desc: 'O ambiente inteiro emana Haki opressor.' },
    { nome: 'Tempestade Anômala', dificuldade: 'Alta', inimigos: 'Forças da natureza', desc: 'Uma tempestade antinatural ameaça destruir tudo.' }
  ]
};

/* ================= FRUTAS ================= */
const frutas = {
  paramecia: [
    { nome: 'Bara Bara no Mi', modelo: 'Paramecia', habilidade: 'Separar o corpo em partes independentes.' },
    { nome: 'Sube Sube no Mi', modelo: 'Paramecia', habilidade: 'Corpo escorregadio que anula impactos.' },
    { nome: 'Kilo Kilo no Mi', modelo: 'Paramecia', habilidade: 'Controle extremo do peso corporal.' }
  ],
  especial: [
    { nome: 'Mochi Mochi no Mi', modelo: 'Paramecia Especial', habilidade: 'Criação e manipulação de mochi com propriedades especiais.' },
    { nome: 'Ope Ope no Mi', modelo: 'Paramecia Suprema', habilidade: 'Manipulação absoluta dentro de uma área criada.' }
  ],
  zoan: [
    { nome: 'Tori Tori no Mi, Modelo: Fênix', modelo: 'Zoan Mítica', habilidade: 'Regeneração através de chamas azuis.' },
    { nome: 'Inu Inu no Mi, Modelo: Okuchi no Makami', modelo: 'Zoan Mítica', habilidade: 'Forma divina lupina com poderes de gelo.' }
  ],
  artificial: [
    { nome: 'Fruta SMILE', modelo: 'Artificial', habilidade: 'Poder Zoan instável.' },
    { nome: 'SMILE Defeituosa', modelo: 'Artificial Falha', habilidade: 'Efeitos colaterais severos e permanentes.' }
  ]
};

/* ================= RECOMPENSAS ================= */
const recompensas = {
  grand: [
    { tipo: 'Tecnica', nome: 'Soru', desc: 'Movimento instantâneo de alta velocidade.' },
    { tipo: 'Tecnica', nome: 'Tekkai', desc: 'Endurecimento do corpo como aço.' },
    { tipo: 'Item', nome: 'Gas Dial', desc: 'Dial que libera gás comprimido.' },
    { tipo: 'Item', nome: 'Jet Dial', desc: 'Dial que gera impulso extremo.' },
    { tipo: 'Equipamento', nome: 'Armadura de Wapolmetal', desc: 'Metal especial altamente resistente.' },
    { tipo: 'Akuma', grupo: 'paramecia' },
    { tipo: 'Navegacao', nome: 'Navio Revestido', desc: 'Permite navegação submarina.' },
    { tipo: 'Ouro', desc: () => `Você obtém ${randInt(2000,8000)} Berries.` }
  ],
  newworld: [
    { tipo: 'Arma', nome: 'Nidai Kitetsu', desc: 'Espada O Wazamono amaldiçoada.' },
    { tipo: 'Arma', nome: 'Kikoku', desc: 'Espada amaldiçoada de Trafalgar Law.' },
    { tipo: 'Arma', nome: 'Napoleon', desc: 'Homie lendário de Big Mom.' },
    { tipo: 'Equipamento', nome: 'Armadura Samurai de Wano', desc: 'Compatível com Haki.' },
    { tipo: 'Akuma', grupo: 'especial' },
    { tipo: 'Akuma', grupo: 'zoan' },
    { tipo: 'Akuma', grupo: 'artificial' },
    { tipo: 'Haki', nome: 'Observação do Futuro', desc: 'Vislumbra acontecimentos futuros.' },
    { tipo: 'Habilidade', nome: 'Voz de Todas as Coisas', desc: 'Comunicação com entidades antigas.' },
    { tipo: 'Relic', nome: 'Road Poneglyph', desc: 'Fragmento essencial para Laugh Tale.' },
    { tipo: 'Ouro', desc: () => `Você obtém ${randInt(10000,40000)} Berries.` }
  ]
};

let modoAtual = '';

function gerarEvento(modo) {
  modoAtual = modo;
  const ev = rand(eventos[modo]);
  document.getElementById('evento').innerHTML = `
    <h2>${ev.nome}</h2>
    <span class="badge">Dificuldade: ${ev.dificuldade}</span>
    <p><strong>Inimigos:</strong> ${ev.inimigos}</p>
    <p>${ev.desc}</p>`;
  document.getElementById('evento').classList.remove('hidden');
  document.getElementById('concluir').classList.remove('hidden');
  document.getElementById('recompensa').classList.add('hidden');
}

function concluirEvento() {
  const r = rand(recompensas[modoAtual]);
  let html = '<h2>🎁 Recompensa Obtida</h2>';

  if (r.tipo === 'Akuma') {
    const fruta = rand(frutas[r.grupo]);
    html += `<p><strong>${fruta.nome}</strong></p>`;
    html += `<p>Modelo: ${fruta.modelo}</p>`;
    html += `<p>Habilidade: ${fruta.habilidade}</p>`;
  } else if (r.tipo === 'Ouro') {
    html += `<p>${r.desc()}</p>`;
  } else {
    html += `<p><strong>${r.nome}</strong></p><p>${r.desc}</p>`;
  }

  document.getElementById('recompensa').innerHTML = html;
  document.getElementById('recompensa').classList.remove('hidden');
}

window.onload = () => {
  document.getElementById('grandBtn').onclick = () => gerarEvento('grand');
  document.getElementById('newBtn').onclick = () => gerarEvento('newworld');
  document.getElementById('concluir').onclick = concluirEvento;
};
</script>
</body>
</html>
